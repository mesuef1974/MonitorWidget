.spw{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sp-top{flex:none;display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.sp-tiles{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sp-ctl{flex:none;display:flex;align-items:center;gap:8px}
.sp-ctl .sctl{margin:0!important}
.sp-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sp-two{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sp-col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px}
.sp-col>.card{flex:1 1 0}
.sp-sub{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink2)}
.sp-sub .sp-hint{margin-inline-start:auto;color:var(--ink3)}
.spw .card{display:flex;flex-direction:column;overflow:hidden!important;min-height:0}
.spw .sp-body>.card{flex:1 1 0}
.spw .card>.cb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden!important;padding:8px 16px 6px}
.spw .card>.pf{padding:0 16px;height:34px}
.spw .schart{flex:1;min-height:90px;height:auto;margin:10px 0 2px}
.sp-nt{flex:none;margin:0;padding:4px 16px 0;font-size:var(--t-sm);color:var(--ink3)}
.spl{flex:1;min-height:0;overflow:hidden;position:relative}
.spl .srow{flex:none;height:var(--rowh);min-height:0;box-sizing:border-box;padding:0}
.spl .srow .nm{overflow:hidden;max-height:calc(var(--rowh) - 6px)}
.spl .srow .nm b,.spl .srow .nm small{display:block!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.spf{display:flex;justify-content:space-between;align-items:center;gap:12px;height:var(--rowh);box-sizing:border-box;border-bottom:1px solid var(--grid);overflow:hidden}
.spf .nm{min-width:0;flex:1}
.spf .nm bdi,.spf .nm small{display:block;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;direction:ltr;text-align:start}
.spf .nm small{direction:rtl;color:var(--ink3);font-size:var(--t-xs)}
.spf b{white-space:nowrap!important;font-size:var(--t-md)}
@media (max-width:980px){.sp-two{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}.sp-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Constrained viewports keep functional sections accessible through scrolling. */
@media(max-width:640px),(max-height:760px){#view{overflow:auto;min-height:0}.band3{grid-template-columns:minmax(0,1fr);flex-shrink:0}.hgrid{overflow:auto;grid-template-rows:auto;min-height:0}.rail{overflow:auto}.nav{min-width:44px}.plist .lrow{min-height:fit-content}}

<style id="ds">
/* ==========================================================================================================================
   مرصد الجهاز — DESIGN SYSTEM (single source of truth)
   Concept: a flight-recorder for one machine. Chart-paper surfaces, flat hairlines (no card shadows), one rail, one accent.
   Order:  1 TOKENS  →  2 BASE  →  3 PAGE LAYOUTS  →  4 COMPONENTS (one definition each)  →  5 STATES
   Rule:   no hex/rgb outside section 1. Every size, radius and colour below comes from a token. Light and dark share ONE structure:
           the bare :root is the complete light palette; the two dark blocks only redefine the same names.
   ========================================================================================================================== */

/* ---------- 1. TOKENS ---------- */
:root{
  /* surfaces + ink (legacy names kept: paper/sheet/ink/ink2/ink3/rule/grid/gridM) */
  --paper:#EEF1F3; --sheet:#F8FAFB; --ink:#0E1726; --ink2:#46566A; --ink3:#5A6775; --rule:#D3DAE1; --grid:#E1E6EB; --gridM:#CFD7DF;
  /* brand + series */
  --commit:#2740F5; --ram:#C42A62;
  --seg1:#2740F5; --seg2:#7345E0; --seg3:#8693A1; --seg4:#E1E6EB;
  /* categorical palette for charts / stacked bars (c1..c8, same hue order in both themes) */
  --c1:#2740F5; --c2:#C42A62; --c3:#7345E0; --c4:#0B7F76; --c5:#A35F00; --c6:#566474; --c7:#0369A1; --c8:#C2410C;
  /* status: foreground + tinted background (+ on-colour for filled use) */
  --ok:#0A7352; --warn:#8F5300; --bad:#B92222; --okbg:#DCF2E9; --warnbg:#F8EBD2; --badbg:#FBE3E3;
  --on-accent:#FFFFFF; --knob:#FFFFFF;
  /* overlays */
  --scrim:rgba(10,16,26,.45); --shadow-pop:0 10px 30px rgba(10,16,26,.16); --shadow-knob:0 1px 2px rgba(10,16,26,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A101A; --sheet:#0F1723; --ink:#E9EEF5; --ink2:#9BAABC; --ink3:#7F90A3; --rule:#1F2B3C; --grid:#131D2B; --gridM:#1C2A3D;
  --commit:#7B91FF; --ram:#FF7FAE;
  --seg1:#7B91FF; --seg2:#B48CFF; --seg3:#55667A; --seg4:#17212F;
  --c1:#7B91FF; --c2:#FF7FAE; --c3:#B48CFF; --c4:#2DD4BF; --c5:#F2B04A; --c6:#8DA0B6; --c7:#38BDF8; --c8:#FB923C;

/* rail */

/* top bar */
.main{min-width:0;padding:0 clamp(16px,3vw,36px) 56px}

.recorder{display:grid;grid-template-columns:292px minmax(0,1fr);border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-md);overflow:hidden}

.plot{position:relative;min-width:0;min-height:340px}.plotin{position:absolute;inset:12px 10px 6px 6px}#ov{position:absolute;inset:0;pointer-events:none;direction:ltr}.el{position:absolute;font:600 var(--t-sm)/1.4 var(--fa);white-space:nowrap;direction:rtl}.el.sm{font-weight:500;font-size:var(--t-xs)}

/* ===== IDENTITY: one shell, one page template, one set of components. Nothing scrolls: lists are paged to the room they have. ===== */
.app{height:100vh;height:100dvh;min-height:0}
.rail{position:static;height:100%;min-height:0;padding:14px 0}
.brand{font:700 var(--t-xs)/1.2 var(--fa);letter-spacing:.02em;color:var(--ink);margin:-8px 0 12px;text-align:center}
.main{display:flex;flex-direction:column;height:100%;min-height:0;min-width:0;padding:0 clamp(14px,2.4vw,32px) 12px}
.top{position:static;flex:none;flex-wrap:wrap;padding:12px 0 10px;gap:10px;backdrop-filter:none;background:none}

/* ---------- 4. COMPONENTS (one definition each; legacy class names are aliases of the same component) ---------- */

/* 4.1 surface · nested block · header · body */
.card,.sec,.boostbox,.tbl,.st-sum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-width:0}
.gt,.gsum>div,.dsum>div,.al-g,.srec{border:0;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line-soft)}
.card>h3,.sec>h3,.gp-ch-h{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font:var(--w-bold) var(--t-md)/var(--lh-snug) var(--fa);color:var(--ink)}
.card>h3,.gp-ch-h{padding:var(--s3) var(--s4) 0}
.sec{padding:var(--s3) var(--s4) var(--s4)} .sec>h3{margin-bottom:var(--s2)}
.card>h3 span,.sec>h3 span,.gp-ch-h .pg-sub,.pg-sub,.gp-sub{font:var(--w-reg) var(--t-sm)/var(--lh-snug) var(--fa);color:var(--ink3)}

.card>.cb,.pg .card>.cb,.hgrid .cb,.sgrid .cb,.dgrid .cb,.cpu-grid .cb,.gp-side .cb,.hhw .cb{padding:var(--s2) var(--s4) var(--s3)}

.kpi .k,.gp-tile .gk,.chan .nm,.gt .gk,.tile .tk{font:var(--w-reg) var(--t-sm)/var(--lh-snug) var(--fa);color:var(--ink3)}
.kpi .v,.gp-tile .gp-v,.chan .big,.tile .tv{font:var(--w-semi) var(--t-num)/var(--lh-tight) var(--fn);letter-spacing:-.02em;direction:ltr;text-align:start}
.kpi .v small,.gp-tile .gp-v small,.chan .big small,.tile .tv small{font:var(--w-med) var(--t-sm)/1 var(--fa);color:var(--ink3);margin-inline-start:var(--s1);letter-spacing:0}
.kpi .s,.gp-tile .gp-s,.chan .dd,.tile .ts{font:var(--w-reg) var(--t-sm)/var(--lh-snug) var(--fa);color:var(--ink3)}
.kpi.ok .v,.tile.ok .tv,.chan.ok .big{color:var(--ink)}
.kpi.warn .v,.tile.warn .tv,.chan.warn .big{color:var(--warn)}
.kpi.bad .v,.tile.bad .tv,.chan.bad .big{color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:0 var(--s3);border-radius:var(--r-pill);font:var(--w-semi) var(--t-sm)/1 var(--fa);white-space:nowrap}

.btn.sm,.sctl .btn,.pg-act .btn{min-height:var(--ctl-h-sm);padding:0 var(--s3);font-size:var(--t-sm);margin-top:0}

.btn:disabled{background:var(--grid);color:var(--ink3);opacity:1;cursor:not-allowed}

/* generic multi-series line chart: o = {t, s:[{v,color,name,fmt}], lo, hi(allVals), span, thr:[[v,color]], ticks(v)} */
function pgChart(host, o) {
  const n = o.t.length, W = Math.max(120, host.clientWidth - 16), H = Math.max(70, host.clientHeight - 6);
  if (n < 2) { host.innerHTML = `<div class="empty">تحتاج دقيقتين من القياس</div>`; return null; }
  const all = o.s.flatMap(x => x.v.filter(v => v != null));
  const L = 42, R = 8, T = 8, B = 20, pw = W - L - R, ph = H - T - B, lo = o.lo, hi = o.hi(all), t0 = o.t[0], t1 = o.t[n - 1];
  const X = i => L + (o.t[i] - t0) / Math.max(1, t1 - t0) * pw, Y = v => T + ph - Math.max(0, Math.min(1, (v - lo) / ((hi - lo) || 1))) * ph;
  const dts = []; for (let i = 1; i < n; i++) dts.push(o.t[i] - o.t[i - 1]);
  const gapT = Math.max(300, 4 * dts.slice().sort((a, b) => a - b)[Math.floor(dts.length / 2)]);
  let paths = "";
  o.s.forEach((s, k) => {
    let ln = "", ar = "", seg = [];
    const flush = () => { if (seg.length) { const p = seg.map(([x, y], j) => (j ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(""); ln += p; if (seg.length > 1 && o.s.length === 1) ar += p + `L${seg[seg.length - 1][0].toFixed(1)} ${T + ph}L${seg[0][0].toFixed(1)} ${T + ph}Z`; seg = []; } };
    s.v.forEach((v, i) => { if (i > 0 && o.t[i] - o.t[i - 1] > gapT) flush(); if (v == null) flush(); else seg.push([X(i), Y(v)]); }); flush();
    paths += (ar ? `<path d="${ar}" fill="${s.color}" opacity=".13"/>` : "") + `<path d="${ln}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  });
  const tf = o.ticks || (v => Math.round(v));
  let grid = "";
  for (let k = 0; k <= 3; k++) { const v = lo + (hi - lo) * k / 3, y = Y(v).toFixed(1); grid += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink3)">${tf(v)}</text>`; }
  let xl = "";
  for (let k = 0; k <= 4; k++) { const ts = t0 + (t1 - t0) * k / 4, x = L + pw * k / 4; xl += `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}" font-size="11" fill="var(--ink3)">${gpStamp(ts, o.span)}</text>`; }
  const th = (o.thr || []).filter(([v]) => v > lo && v < hi).map(([v, c]) => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${c}" stroke-dasharray="4 4" opacity=".7"/>`).join("");
  const dots = o.s.map((s, k) => `<circle class="xd" data-k="${k}" r="4" fill="${s.color}" stroke="var(--sheet)" stroke-width="1.5" opacity="0"/>`).join("");
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "")}">${grid}${th}${paths}${xl}<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--ink3)" opacity="0"/>${dots}</svg>`;
  const svg = host.firstChild;
  return { host, o, X, Y, L, pw, t0, t1, n, xh: svg.querySelector(".xh"), xds: [...svg.querySelectorAll(".xd")] };
}
function pgCV(g, i) {
  const el = g.host.parentNode.querySelector(".cv"); if (!el) return;
  const idx = i == null ? (() => { let k = g.n - 1; while (k > 0 && g.o.s.every(s => s.v[k] == null)) k--; return k; })() : i;
  el.innerHTML = g.o.s.map(s => s.v[idx] == null ? "" : `${g.o.s.length > 1 ? `<span style="color:${s.color}">●</span> ${esc(s.name)} ` : ""}<bdi>${s.fmt(s.v[idx])}</bdi>`).filter(Boolean).join(" · ") + (i == null ? "" : ` · <bdi>${gpStamp(g.o.t[idx], g.o.span)}</bdi>`);
}
function pgHover(e) {
  const host = e.target.closest && e.target.closest(".gp-plot"); if (!host || !PGC.length) return;
  const ref = PGC.find(g => g && g.host === host); if (!ref) return;
  const r = host.getBoundingClientRect(), x = e.clientX - r.left - 8, f = Math.max(0, Math.min(1, (x - ref.L) / ref.pw)), tt = ref.t0 + f * (ref.t1 - ref.t0), ts = ref.o.t;
  let lo = 0, hi = ts.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] < tt) lo = m; else hi = m; }
  const i = Math.abs(ts[lo] - tt) <= Math.abs(ts[hi] - tt) ? lo : hi;
  PGC.forEach(g => { if (!g || g.o.t !== ts) return; g.xh.setAttribute("x1", g.X(i)); g.xh.setAttribute("x2", g.X(i)); g.xh.setAttribute("opacity", ".6"); g.xds.forEach((d, k) => { const v = g.o.s[k].v[i]; if (v == null) d.setAttribute("opacity", 0); else { d.setAttribute("cx", g.X(i)); d.setAttribute("cy", g.Y(v)); d.setAttribute("opacity", 1); } }); pgCV(g, i); });
}
function pgLeave() { PGC.forEach(g => { if (!g) return; g.xh.setAttribute("opacity", 0); g.xds.forEach(d => d.setAttribute("opacity", 0)); pgCV(g, null); }); }
/* hide trailing rows that do not fit; shows "+N more" */
function pgFit(L, label) {
  L.querySelectorAll(".gp-more").forEach(x => x.remove());
  const rows = [...L.querySelectorAll(".gp-row,.pg-tr:not(.pg-th),.pg-item")]; rows.forEach(r => r.style.display = "");
}
let PGSPEC = null;
function pgFitAll() {
  const root = document.getElementById("pg-" + tab); if (!root) return;
  if(root.classList.contains("mp-root")){MP_STAGE.fit(root);return;}
  if(root.classList.contains("pwa-root")){PWA_STAGE.fit(root);return;}
  if (PGSPEC && PGSPEC.tab === tab) PGC = [...root.querySelectorAll(".gp-plot")].map((h, i) => { const sp = PGSPEC.charts[i]; if (!sp) return null; const g = pgChart(h, sp); if (g) pgCV(g, null); return g; });
  root.querySelectorAll(".gp-list").forEach(L => pgFit(L, L.dataset.more || "أخرى"));
}
function pgBind(root) {
  const cc = root.querySelector(".pg-charts"); if (cc) { cc.addEventListener("pointermove", pgHover); cc.addEventListener("pointerleave", pgLeave); }
  if (!pgRO && window.ResizeObserver) { pgRO = new ResizeObserver(() => { if (PERF.includes(tab) && tab !== "cpu" && tab !== "gpu" || tab === "advice" || tab === "alerts") pgFitAll(); }); pgRO.observe(document.getElementById("view")); }
}
async function pgStart(t, url, draw, ms) {
  clearInterval(pgTimer);
  const load = async () => { try { PGD[t] = await api(typeof url === "function" ? url() : url); if (tab === t) draw(PGD[t]); } catch (e) { const el = document.getElementById("pg-" + t); if (el && !PGD[t]) el.innerHTML = `<div class="empty">تعذّر قراءة البيانات: ${esc(e.message)}</div>`; } };
  if (PGD[t]) draw(PGD[t]); await load();
  if (ms) pgTimer = setInterval(() => { if (allowAutomatic() && tab === t) load(); }, ms);
}
const pgHead = (title, chips, extra) => `<section class="card gp-head" aria-label="${esc(title)}"><div class="chips">${chips}</div>${extra || ""}<button type="button" class="btn line" data-pgrefresh="1" title="تحديث بيانات الصفحة الآن">تحديث</button></section>`;
const pgChartCard = (title) => `<section class="card gp-ch"><div class="gp-ch-h"><span>${title}</span><span class="cv">—</span></div><div class="gp-plot"></div></section>`;

/* ---------- memory ---------- */
function viewMem() { return pgMount("mem"); }
function afterMem() { pgStart("mem", () => "/api/mem?range=" + pgRange.mem, drawMem, 5000); }
function drawMem(d) {
  const el = document.getElementById("pg-mem"); if (!el) return;
  const m = d.m, p = d.perf || {}, th = d.thr, sr = d.series;
  const notes = [];
  if (m.ramPct >= th.ramBad) notes.push(pgNote("bad", "الذاكرة الفعلية شبه ممتلئة", `المستخدم ${m.ramPct}% والمتاح ${m.availGB} GB فقط. ابدأ بتنظيف الذاكرة ثم أغلق أكبر المستهلكين.`));
  else if (m.ramPct >= th.ramWarn) notes.push(pgNote("warn", "الذاكرة مرتفعة", `المستخدم ${m.ramPct}% والمتاح ${m.availGB} GB. ما زال هناك هامش لكنه يتقلص.`));
  else notes.push(pgNote("ok", "الذاكرة ضمن الحدود", `المستخدم ${m.ramPct}% والمتاح ${m.availGB} GB.`));
  if (m.commitPct >= th.commitWarn) notes.push(pgNote(m.commitPct >= th.commitBad ? "bad" : "warn", "الالتزام مرتفع", `${m.commitGB} من ${m.limitGB} GB. عند بلوغ الحد تفشل البرامج في طلب ذاكرة جديدة.`));
  if (d.leaks && d.leaks.length) notes.push(pgNote("warn", "ذاكرة تنمو باستمرار", d.leaks.map(l => `${l.name} +${l.growthMB} MB خلال ${l.hours} س`).join(" · ")));
  const wc = d.wslcfg || {}; const hasCap = wc.exists && Object.keys(wc.values || {}).some(k => k.endsWith("memory"));
  if (!hasCap && d.wslGB >= 2) notes.push(pgNote("info", "WSL بلا سقف ذاكرة", `يحجز الآن ${d.wslGB} GB ولا سقف في .wslconfig. وضع السقف مؤجل حتى ينتهي العمل على Docker.`));
  const tiles = [
    gpTile("الذاكرة الفعلية", pgNum(m.ramPct, 0), "%", m.ramPct, pgC(m.ramPct, th.ramWarn, th.ramBad), `متاح <bdi>${m.availGB} GB</bdi> من <bdi>${m.totalGB}</bdi>`),
    gpTile("الالتزام", pgNum(m.commitPct, 0), "%", m.commitPct, pgC(m.commitPct, th.commitWarn, th.commitBad), `<bdi>${m.commitGB}</bdi> / <bdi>${m.limitGB} GB</bdi>${p.commitPeakGB ? ` · ذروة <bdi>${p.commitPeakGB}</bdi>` : ""}`),
    gpTile("كاش النظام", pgNum(p.cacheGB, 1), "GB", 100 * (p.cacheGB || 0) / (m.totalGB || 16), "var(--commit)", "ملفات مخزّنة مؤقتاً تُسترد عند الحاجة"),
    gpTile("ذاكرة النواة", pgNum(p.kernelGB, 1), "GB", 100 * (p.kernelGB || 0) / (m.totalGB || 16), "var(--seg2)", `مقسّمة <bdi>${pgNum(p.kernelPagedGB, 2)}</bdi> · ثابتة <bdi>${pgNum(p.kernelNonpagedGB, 2)}</bdi>`),
    gpTile("العمليات", pgNum(p.procs), "", 0, "var(--ink3)", `<bdi>${pgNum(p.threads)}</bdi> خيط · <bdi>${pgNum(p.handles)}</bdi> مقبض`)
  ].join("");
  const totalMB = (m.totalGB || 16) * 1024;
  const cats = pgBars(d.cats.map(c => ({ l: c.label, sub: c.n ? "×" + c.n : "", r: pgMB(c.mb), v: c.mb, c: c.cat === "claude" || c.cat === "wsl" ? "var(--ram)" : "" })), totalMB * 0.4, "");
  const top = pgBars(d.top.map(t => ({ l: t.name, sub: t.n > 1 ? "×" + t.n : "", r: pgMB(t.privMB), v: t.privMB })), Math.max(1, ...d.top.map(t => t.privMB)), "");
  MP_STAGE.render(el, pgHead("الذاكرة", `<span class="chip idle">الإجمالي <bdi>${m.totalGB} GB</bdi></span><span class="chip idle">حدّ الالتزام <bdi>${m.limitGB} GB</bdi></span>`, pgTrimActs() + pgRanges("mem")) +
    `<div class="gp-notes">${notes.join("")}</div><div class="gp-kpis" style="--n:5">${tiles}</div>
    <div class="pg-body"><div class="pg-col pg-charts">${pgChartCard("الذاكرة الفعلية والالتزام")}${pgChartCard("الذاكرة المتاحة")}</div>
    <div class="pg-col"><section class="card"><h3>حسب الفئة</h3><div class="cb"><div class="gp-list" data-more="فئات">${cats}</div></div></section>
    <section class="card"><h3>أكبر البرامج <small class="pg-sub">الذاكرة الخاصة، مجمّعة بالاسم</small></h3><div class="cb"><div class="gp-list" data-more="برامج أخرى">${top}</div></div></section></div></div>`,d);
  PGSPEC = { tab: "mem", charts: [
    { t: sr.t, span: d.span, title: "الذاكرة والالتزام", s: [{ v: sr.ram, color: "var(--ram)", name: "الذاكرة", fmt: v => Math.round(v) + "%" }, { v: sr.commit, color: "var(--commit)", name: "الالتزام", fmt: v => Math.round(v) + "%" }], lo: 0, hi: () => 100, thr: [[th.ramWarn, "var(--warn)"], [th.ramBad, "var(--bad)"]] },
    { t: sr.t, span: d.span, title: "المتاح", s: [{ v: sr.avail, color: "var(--ok)", name: "المتاح", fmt: v => v.toFixed(1) + "GB" }], lo: 0, hi: a => Math.max(4, Math.ceil(Math.max(...a, 0) + 1)), ticks: v => v.toFixed(v < 10 ? 1 : 0) }
  ] };
  MP_STAGE.fit(el); MP_STAGE.bind(el);
}

/* ---------- processes ---------- */

  if (d.bareNow > 0) notes.push(pgNote("warn", `${d.bareNow} شل خامل تابع لـ Claude`, live ? "الكانس سينهيها في دورته القادمة." : "الكانس في وضع التجربة فلن ينهيها؛ يسجّل فقط."));

  notes.push(pgNote(live ? "ok" : "info", live ? "الكانس يعمل فعلياً" : "الكانس في وضع التجربة", live ? `أنهى ${rp.killed24h} عملية في آخر 24 ساعة.` : `سجّل ${rp.would24h} حالة كان سينهيها في آخر 24 ساعة.`));

    gpTile("نوافذ conhost", d.conhost, "", Math.min(100, d.conhost * 4), d.conhost > 40 ? "var(--warn)" : "var(--ok)", "واحدة لكل شل أو أداة طرفية"),

    `<div class="card gp-tile"><div class="gk">كانس الشلات</div><div class="gp-v txt"><span class="chip ${live ? "ok" : "warn"}">${live ? "تنفيذ فعلي" : "تجربة فقط"}</span></div><div class="gp-s" style="margin-top:7px">أنهى <bdi>${rp.killed24h}</bdi> · سجّل <bdi>${rp.would24h}</bdi> (24 س)</div></div>`

  const cl = d.claude.length ? `<div class="pg-tr pg-th" style="--cols:64px 70px 80px 1fr"><span>PID</span><span>العمر</span><span>ذاكرة</span><span>معالج (نواة)</span></div>` +
    d.claude.map(c => `<div class="pg-tr" style="--cols:64px 70px 80px 1fr"><span class="ltr">${c.pid}</span><span>${pgDur(c.age)}</span><span class="ltr">${c.mb}MB</span><span class="ltr">${c.cores.toFixed(2)}</span></div>`).join("") : pgEmpty("لا عمليات Claude.");
  const cats = pgBars(d.cats.map(c => ({ l: c.label, sub: "×" + c.n, r: pgMB(c.mb), v: c.mb })), Math.max(1, ...d.cats.map(c => c.mb)), "");

    <section class="card"><h3>عمليات Claude <small class="pg-sub">${d.claudeTotal}</small></h3><div class="cb"><div class="gp-list pg-table" data-table="claude" data-more="عمليات أخرى">${cl}</div></div></section></div>
