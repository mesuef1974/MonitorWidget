name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python syntax
        shell: bash
        run: python -m compileall -q $(git ls-files '*.py')
      - name: PowerShell parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.ps1') {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$null,[ref]$e)
            if ($e) { $e | ForEach-Object { "$f : $($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Secret guard
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.token|\.db$|\.dmp$|\.pem$'; then echo "tracked secret/state file"; exit 1; fi
      # الاختبارات المعزولة (بلا خادم ولا نافذة): شبكة أمان تجزئة server.py (البند 6)
      - name: Python regression (isolated)
        shell: bash
        run: |
          python -X utf8 -B tests/backend_regression.py
          python -X utf8 -B tests/window_security_check.py
          python -X utf8 -B tests/commit_check.py
          python -X utf8 -B tests/procclose_check.py
          python -X utf8 -B tests/winguard_check.py
          python -X utf8 -B tests/localai_check.py
          python -X utf8 -B tests/assistant_check.py
          python -X utf8 -B tests/askstore_check.py
          python -X utf8 -B tests/explain_model_check.py
          python -X utf8 -B tests/routes_app_check.py
          python -X utf8 -B tests/websession_check.py
          python -X utf8 -B tests/webstatic_check.py
          python -X utf8 -B tests/webboot_check.py
          python -X utf8 -B tests/commitmap_check.py
          python -X utf8 -B tests/commitwatch_check.py
          python -X utf8 -B tests/bootwatch_check.py
          python -X utf8 -B tests/powerhealth_check.py
          python -X utf8 -B tests/cpuprio_check.py
          python -X utf8 -B tests/procprio_check.py
          python -X utf8 -B tests/widgetwatch_check.py
          python -X utf8 -B tests/boothist_check.py
          python -X utf8 -B tests/battwatch_check.py
          python -X utf8 -B tests/sleepwatch_check.py
          python -X utf8 -B tests/portwatch_check.py
          python -X utf8 -B tests/check_all.py

  # دوال widget.ps1 وidentity.ps1 النقية (مستخرجة عبر AST؛ لا نافذة ولا إعدادات)
  pester:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          $mod = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $mod -or $mod.Version.Major -lt 5) { Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck }
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path tests/widget_functions.Tests.ps1 -CI

  # كل صفحات web/index.html في الوضعين على خادم ثوابت (لا مرصد حيّ)؛ مبني على shots/lay/tour.cjs
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/e2e/package-lock.json }
      - name: Install
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pages
        working-directory: tests/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: tests/e2e/test-results, retention-days: 7 }
