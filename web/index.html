<!doctype html>

<meta name="theme-color" content="#0d0c0b">

<link rel="preload" href="/fonts/zain-400-1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/zain-700-3.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/outfit-400-2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<div class="app">
  <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
  <div class="main">
    <header class="bar">
      <button class="btn menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="grow"><h1 id="title">…</h1><div class="sub" id="subtitle"></div></div>
      <span class="live" id="live"><i></i><span id="liveTxt">جارٍ التحميل…</span><span class="sr" id="liveState" role="status"></span></span>
      <button class="btn" id="widgetBtn" aria-pressed="false" title="إظهار الويدجت أو إخفاؤه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>الويدجت</span></button><span class="boost"><button class="btn primary" id="boost" title="تنظيف الذاكرة الآن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8z"/></svg><span id="boostTxt">تنظيف الذاكرة</span></button><select class="btn" id="boostMode" aria-label="عمق التنظيف" title="بسيط: آمن ولا يجمّد الجهاز. متوسط: العمليات الخاملة. عميق: يفرّغ التطبيقات النشطة وقد يجمّد الجهاز"><option value="light">بسيط (آمن)</option><option value="medium">متوسط (الخاملة)</option><option value="deep">عميق (بتأكيد)</option></select></span><select class="btn" id="every" aria-label="معدل التحديث"><option value="5000">كل 5 ثوانٍ</option><option value="10000">كل 10 ثوانٍ</option><option value="30000">كل 30 ثانية</option><option value="0">يدوي</option></select>
      <button class="btn" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>تحديث</button>
      <button class="btn" id="theme" aria-label="تبديل السمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>
<script>
"use strict";
/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, d = 0) => (v == null || !isFinite(v)) ? "—" : Number(v).toLocaleString("en", { maximumFractionDigits: d, minimumFractionDigits: d });
const Q = (v, u = "", d = 0) => `<bdi dir="ltr" class="q">${nf(v, d)}${u ? "&nbsp;" + u : ""}</bdi>`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const arN = (n, one, two, few, many) => n == null ? "—" : n == 0 ? `لا ${few}` : n == 1 ? one : n == 2 ? two : `${Q(n)} ${(n % 100 >= 3 && n % 100 <= 10) ? few : many}`;   // مطابقة العدد العربي: مفرد، مثنى، 3-10 جمع، 11+ مفرد منصوب
const hhmm = t => new Date(t * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const dhm = t => new Date(t * 1000).toLocaleString("en-GB", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(",", "");   // يوم/شهر ساعة:دقيقة للمدى الذي يتجاوز يومًا
const level = (v, warn, bad) => v >= bad ? "bad" : v >= warn ? "warn" : "ok";
const gb = mb => mb >= 1024 ? nf(mb / 1024, 1) + " GB" : nf(mb, 0) + " MB";
const rate = bps => bps >= 1048576 ? nf(bps / 1048576, 1) + " MB/s" : bps >= 1024 ? nf(bps / 1024, 0) + " KB/s" : nf(bps, 0) + " B/s";
const ICON = {
  ask: '<path d="M21 12a8 8 0 0 1-8 8H4l2.500-3A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/>',
  home: '<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>', heart: '<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.600-9 9-9 9z"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  mem: '<rect x="3" y="8" width="18" height="8" rx="1.500"/><path d="M7 8v8M12 8v8M17 8v8M6 19v-3M18 19v-3"/>',
  gpu: '<rect x="2" y="6" width="18" height="12" rx="2"/><circle cx="10" cy="12" r="3.200"/><path d="M20 9h2v6h-2M5 18v2M9 18v2"/>',
  ext: '<path d="M7 17L17 7M8 7h9v9"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>'
};
const svgi = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ""}</svg>`;

/* ───────── components ───────── */
function gauge({ value, label, unit = "%", sub = "", warn = 80, bad = 92, max = 100, decimals = 0 }) {
  const R = 62, C = 2 * Math.PI * R, sweep = 0.75, len = C * sweep;
  if (value != null && !isFinite(value)) value = null;
  const pct = clamp((value ?? 0) / max, 0, 1), lv = value == null ? "ok" : level(value / max * 100, warn, bad);
  const col = `var(--${lv === "ok" ? "accent" : lv})`, off = (len * (1 - pct)).toFixed(1);
  let ticks = ""; for (let i = 0; i <= 20; i++) { const a = (135 + 270 * i / 20) * Math.PI / 180, big = i % 5 === 0, r1 = 74, r2 = big ? 80 : 77; ticks += `<line x1="${(90 + r1 * Math.cos(a)).toFixed(1)}" y1="${(90 + r1 * Math.sin(a)).toFixed(1)}" x2="${(90 + r2 * Math.cos(a)).toFixed(1)}" y2="${(90 + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--ink3)" stroke-width="${big ? 1.6 : 1}" opacity="${big ? .7 : .4}"/>`; }
  return `<div class="gauge"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)} ${nf(value, decimals)}${esc(unit)}">
    ${ticks}
    <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--raise)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(135 90 90)"/>
    <circle class="arc-glow" cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}" transform="rotate(135 90 90)"/>
    <circle class="arc" cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}" transform="rotate(135 90 90)"/>
    <text class="gv" x="90" y="96" text-anchor="middle">${nf(value, decimals)}</text><text class="gu" x="90" y="118" text-anchor="middle">${esc(unit)}</text></svg>
    <div class="gl">${esc(label)}</div>${sub ? `<div class="gs">${sub}</div>` : ""}</div>`;
}
const meter = (v, warn = 80, bad = 92, max = 100) => `<div class="meter ${level(v / max * 100, warn, bad) === "ok" ? "" : level(v / max * 100, warn, bad)}"><i style="--p:${((clamp(v / max * 100, 0, 100)) / 100).toFixed(3)}"></i></div>`;
const kpi = (l, v, u = "", s = "", m = "") => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v"><span class="num">${v}</span>${u ? `<small>${esc(u)}</small>` : ""}</div>${m}${s ? `<div class="s">${s}</div>` : ""}</div>`;
const tblScroll = b => b.replace(/(<div class="scroll xs">)?(<table class="tbl"[\s\S]*?<\/table>)/g, (m, wrap, t) => wrap ? m : `<div class="scroll">${t}</div>`);   // الجدول في مقدّمة البطاقة يُمرَّر داخلها
// كل جدول داخل لوحة يحمل اسم اللوحة (ما لم يُسمَّ) ورؤوسه رؤوس أعمدة؛ الرأس الفارغ فوق عمود الأزرار يُسمّى «إجراءات» بنص مخفي
const tblNames = (b, title) => b.replace(/<table class="tbl"(?![^>]*aria-label)/g, `<table class="tbl" aria-label="${esc(title)}"`).replace(/<th(?=[\s>])/g, '<th scope="col"').replace(/<th scope="col"><\/th>/g, '<th scope="col"><span class="sr">إجراءات</span></th>');
const panel = (title, body, { cls = "", meta = "", id = "" } = {}) => `<section class="panel ${cls}" ${id ? `id="${id}"` : ""}><div class="ph"><h2>${esc(title)}</h2><span class="meta">${meta}</span></div>${tblScroll(tblNames(body, title))}</section>`;
const skeleton = n => Array.from({ length: n }, (_, i) => `<section class="panel ${i % 3 === 0 ? "c8" : "c4"}"><div class="sk" style="height:14px;width:30%"></div><div class="sk" style="height:${120 + i % 3 * 40}px"></div></section>`).join("");

/* Line/area chart with a crosshair and tooltip, by pointer or keyboard (←/→ a point, Shift ten points, Home/End the ends, Esc hides). series: [{name,color,v:[],fmt,dashed}]
   الإتاحة: <svg role="img"> يحمل ملخصًا نصيًا (آخر قيمة وأدناها وأعلاها لكل سلسلة والمدى الزمني)، و.plot قابل للتركيز ويصفه الملخص، وقيم النقطة المختارة بلوحة المفاتيح تُعلن في منطقة حية مخفية */
let chartSeq = 0;
function chart(el, { t, series, min = 0, max = null, height = 190, yFmt = v => nf(v, 0), fill = true }) {
  const csig = JSON.stringify([t, series.map(s => [s.id, s.v, s.dashed])]); if (el.dataset.csig === csig && el.firstElementChild) return; el.dataset.csig = csig;   // اللوحة بقيت (paint) والبيانات لم تتغيّر: الرسم ومستمعاته يبقيان
  const W = 1000, pad = 6, H = Math.max(height, Math.round((el.clientHeight || 0) - 24));
  const title = el.closest(".panel")?.querySelector("h2")?.textContent || series.map(s => s.name).join(" و"), cid = "chart-" + (++chartSeq);
  const stat = s => { const v = s.v.filter(x => x != null), f = s.fmt || yFmt; return v.length ? `${s.name}: آخر قيمة ${f(v[v.length - 1])}، أدنى ${f(Math.min(...v))}، أعلى ${f(Math.max(...v))}` : `${s.name}: لا بيانات`; };
  const tf = t.length > 1 && t[t.length - 1] - t[0] > 20 * 3600 ? dhm : hhmm;   // الملخص والإعلان وتسميات المحور تذكر اليوم عندما يتجاوز المدى عشرين ساعة؛ التلميح يبقى بالساعة
  const summary = t.length > 1 ? `رسم بياني «${title}» من ${tf(t[0])} إلى ${tf(t[t.length - 1])}، ${nf(t.length)} نقطة. ${series.map(stat).join(". ")}.` : `رسم بياني «${title}»: لا بيانات كافية.`;
  const all = series.flatMap(s => s.v.filter(x => x != null));
  const hi = max ?? (all.length ? Math.max(...all) * 1.12 || 1 : 1), lo = min;
  const n = t.length, X = i => n < 2 ? 0 : i / (n - 1) * W, Y = v => H - pad - (clamp(v, lo, hi) - lo) / (hi - lo || 1) * (H - pad * 2);
  const paths = series.map(s => {
    let d = "", seg = false; s.v.forEach((v, i) => { if (v == null) { seg = false; return; } d += `${seg ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`; seg = true; });
    const area = fill && s.fill !== false ? `<path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#g-${s.id})" opacity=".9"/>` : "";
    return `<linearGradient id="g-${s.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".26"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>${area}<path class="ln" d="${d}" stroke="${s.color}" ${s.dashed ? 'stroke-dasharray="6 5"' : ""}/>`;
  }).join("");
  // عدد تسميات المحور الأفقي بحسب عرض الرسم: تسمية باليوم (~80px) أو بالساعة (~40px) مع فراغ بينها، بين تسميتين وخمس؛ وإلا تراكبت في البطاقات الضيقة
  const nx = clamp(Math.floor(((el.clientWidth || 600) - 44) / ((tf === dhm ? 80 : 40) * 1.5)), 2, 5);
  const ys = [0, .25, .5, .75, 1], xs = Array.from({ length: nx }, (_, i) => i / (nx - 1));
  el.innerHTML = `<div class="chart" style="height:${H}px;margin-block-end:22px"><div class="plot" style="height:${H}px" tabindex="0" role="group" aria-label="${esc(title)}: الأسهم لقراءة القيم" aria-describedby="${cid}" aria-keyshortcuts="ArrowLeft ArrowRight Home End Escape"><svg id="${cid}" role="img" aria-label="${esc(summary)}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><g class="grid">${ys.map(f => `<line x1="0" x2="${W}" y1="${(H - pad - f * (H - pad * 2)).toFixed(1)}" y2="${(H - pad - f * (H - pad * 2)).toFixed(1)}"/>`).join("")}</g>${paths}</svg>
    ${ys.map(f => `<span class="yl" aria-hidden="true" style="top:${((H - pad - f * (H - pad * 2)) / H * 100).toFixed(1)}%">${yFmt(lo + (hi - lo) * f)}</span>`).join("")}
    ${n > 1 ? xs.map(f => `<span class="xl" aria-hidden="true" style="left:${f * 100}%">${tf(t[Math.round(f * (n - 1))])}</span>`).join("") : ""}
    <div class="cur"></div><div class="tip" aria-hidden="true"></div><span class="sr" aria-live="polite"></span></div></div>`;
  if (n < 2) return;
  const box = $(".plot", el), cur = $(".cur", box), tip = $(".tip", box), live = $(".sr", box);
  // الأبعاد تُقرأ عند دخول المؤشر أو التركيز وعند تغيّر الحجم، لا في كل pointermove؛ والتلميح يُوضع يمين المؤشر في النصف الأيسر ويساره في النصف الأيمن فلا يحتاج قياس عرضه
  let rect = null, at = -1;
  const measure = () => { rect = box.getBoundingClientRect(); };
  new ResizeObserver(measure).observe(box);
  const row = i => `<b>${hhmm(t[i])}</b>` + series.map(s => `<div><span><i style="background:${s.color}"></i> ${esc(s.name)}</span><span class="num">${s.v[i] == null ? "—" : (s.fmt || yFmt)(s.v[i])}</span></div>`).join("");
  const say = i => `${tf(t[i])}: ` + series.map(s => `${s.name} ${s.v[i] == null ? "لا قيمة" : (s.fmt || yFmt)(s.v[i])}`).join("، ");
  const showAt = (i, announce) => {
    at = clamp(i, 0, n - 1); if (!rect) measure(); const f = at / (n - 1), x = f * rect.width;
    cur.style.display = tip.style.display = "block"; cur.style.left = (f * 100) + "%"; tip.innerHTML = row(at);
    if (f < .6) { tip.style.left = (x + 14) + "px"; tip.style.right = "auto"; } else { tip.style.right = (rect.width - x + 14) + "px"; tip.style.left = "auto"; }
    if (announce) live.textContent = say(at);
  };
  const hide = () => { cur.style.display = tip.style.display = "none"; at = -1; };
  box.addEventListener("pointerenter", measure);
  box.addEventListener("pointermove", e => { if (!rect) measure(); showAt(Math.round(clamp((e.clientX - rect.left) / rect.width, 0, 1) * (n - 1)), false); });
  box.addEventListener("pointerleave", () => { if (document.activeElement !== box) hide(); });
  box.addEventListener("focus", () => { measure(); showAt(n - 1, false); });
  box.addEventListener("blur", () => { hide(); live.textContent = ""; });
  box.addEventListener("keydown", e => {
    const step = e.shiftKey ? Math.max(1, Math.round(n / 10)) : 1, cur0 = at < 0 ? n - 1 : at;
    const next = { ArrowRight: cur0 + step, ArrowLeft: cur0 - step, Home: 0, End: n - 1 }[e.key];
    if (next != null) showAt(next, true); else if (e.key === "Escape" && at >= 0) hide(); else return;
    e.preventDefault();
  });
}
const legend = items => `<div class="legend">${items.map(([c, l, d]) => `<span><i style="background:${c};${d ? "background:repeating-linear-gradient(90deg," + c + " 0 5px,transparent 5px 8px)" : ""}"></i>${esc(l)}</span>`).join("")}</div>`;
const compact = (arr, n = 140) => { if (arr.length <= n) return arr.map((_, i) => i); const step = arr.length / n; return Array.from({ length: n }, (_, i) => Math.floor(i * step)); };

/* ───────── data layer ───────── */
let ctl = null;
async function api(path) {
  const r = await fetch(path, { credentials: "same-origin", signal: ctl?.signal, headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
const settle = async (...ps) => (await Promise.allSettled(ps)).map(r => r.status === "fulfilled" ? r.value : null);

/* ───────── pages ───────── */
const state = { range: "24h" };
const RANGES = [["1h", "ساعة"], ["6h", "6 ساعات"], ["24h", "24 ساعة"], ["7d", "7 أيام"]];
const rangeChips = () => `<div class="chips" role="group" aria-label="المدى الزمني">${RANGES.map(([k, l]) => `<button data-range="${k}" aria-pressed="${state.range === k}">${l}</button>`).join("")}</div>`;
const verdict = score => score >= 90 ? ["ممتازة", "ok"] : score >= 75 ? ["جيدة", "ok"] : score >= 55 ? ["تحتاج انتباهًا", "warn"] : ["حرجة", "bad"];

const PAGES = {
  overview: {
    title: "نظرة عامة", sub: "حالة الجهاز الآن في لمحة واحدة", icon: "home",
    async load() { return settle(api("/api/home"), api("/api/mem?range=6h"), api("/api/health")); },
    render([home, mem, health]) {
      if (!home && !mem) return nodata("البيانات من الخادم");
      const m = mem?.m || {}, sc = health?.score?.score, [vt, vl] = sc != null ? verdict(sc) : ["—", ""];
      const cpuPct = home?.cpu?.pct, g = home?.gpu, io = home?.io?.now;
      const ms = mem?.series, idx = ms ? compact(ms.t, 160) : [];
      let out = panel("الحالة العامة", `<div class="hero"><div class="big num" style="color:var(--${vl === "bad" ? "bad" : vl === "warn" ? "warn" : "accent-text"})">${sc ?? "—"}</div><div><h3>صحة الجهاز ${vt}</h3><p>${health?.forecast ? `المساحة الحرة على C ${nf(health.forecast.freeGB, 1)} GB، والاتجاه ${esc(health.forecast.state)}${health.forecast.daysLeft ? ` — يكفي نحو ${nf(health.forecast.daysLeft)} يومًا` : ""}.` : "لا تتوفر بيانات التوقع بعد."}</p><div class="pill-row mt-2"><span class="tag ${vl}">${health?.score?.coveragePct ?? "—"}% تغطية القياس</span><span class="tag">${nf(m.claude)} عملية Claude</span><span class="tag">${nf(io?.stalls24 ?? home?.io?.stalls24)} توقفات قرص / 24س</span></div></div></div>`, { cls: "c12" });
      out += panel("المقاييس الحية", `<div class="gauges">${gauge({ value: cpuPct, label: "المعالج", sub: `${Q(home?.cpu?.cores, "", 1)} من ${Q(home?.cpu?.ncpu)} نواة`, warn: 70, bad: 90 })}${gauge({ value: m.ramPct, label: "الذاكرة الفعلية", sub: `${Q(m.totalGB - m.availGB, "", 1)} من ${Q(m.totalGB, "GB", 1)}`, warn: 80, bad: 92 })}${gauge({ value: m.commitPct, label: "التزام الذاكرة", sub: `${Q(m.commitGB, "", 1)} من ${Q(m.limitGB, "GB", 1)}`, warn: 85, bad: 95 })}${gauge({ value: m.diskPct, label: "القرص C", sub: `حرّ ${Q(m.diskFreeGB, "GB", 1)}`, warn: 85, bad: 93 })}${(m.drives || []).map(d => gauge({ value: d.pct, label: `القرص ${esc(d.letter)}`, sub: `حرّ ${Q(d.freeGB, "GB", 1)}`, warn: 85, bad: 93 })).join("")}</div>`, { cls: "c8" });

  ask: {
    title: "اسأل المرصد", sub: "اسأل النموذج المحلي عن الجهاز، ولا يُنفَّذ أمر إلا بعد تأكيدك", icon: "ask",
    async load() {
      if (!askState.loaded) {
        const d = await api("/api/assistant").catch(() => null);
        // بطاقات الأوامر لا تُحفظ: القديم نص فقط، ولا يُرسل سياقًا لأن أرقامه قديمة
        if (d) { askState.msgs = d.turns.map(t => ({ ...t, old: true })).concat(askState.msgs); askState.facts = d.facts; askState.ratings = d.ratings; askState.loaded = true; }
      }
      return [{ ok: 1 }];
    },
    render() {
      const m = askState.msgs, r = askState.ratings, hints = ["لماذا الجهاز بطيء؟", "كم المساحة الحرة؟", "ما حرارة كرت الرسوميات؟", "نظّف الذاكرة"];
      const log = m.length ? m.map(askMsg).join("") : `<p class="sub">ابدأ بسؤال، أو اختر واحدًا:</p><div class="acts">${hints.map(h => `<button class="btn" data-askq="${esc(h)}">${esc(h)}</button>`).join("")}</div>`;
      return panel("المحادثة", `<div class="ask-log" role="log" aria-label="المحادثة">${log}${askState.busy ? `<p class="sub" role="status">يقرأ القياسات ويكتب الجواب…</p>` : ""}</div>
        <form id="askForm" class="ask-form"><label class="sr" for="askInput">سؤالك</label><textarea id="askInput" rows="2" maxlength="500" placeholder="اكتب سؤالك أو طلبك">${esc(askState.draft)}</textarea><button class="btn primary" type="submit"${askState.busy ? " disabled" : ""}>أرسل</button></form>
        <p class="note">يعمل محليًّا ويقرأ قياسات المرصد فقط. قد يخطئ النموذج، فراجع الأرقام في صفحاتها قبل أن تتصرف. تُحفظ المحادثة على هذا الجهاز 30 يومًا.</p>
        ${r.good + r.bad ? `<p class="note">التقييمات: ${r.good} مفيد، ${r.bad} خاطئ</p>` : ""}
        ${m.length ? `<div class="acts"><button class="btn" data-askclear="1">امسح المحادثة</button></div>` : ""}`, { cls: "c12" })
        + panel("تعليمات دائمة", `<p class="sub">يلتزم بها النموذج في كل سؤال، ولا يكتبها غيرك.</p>
        ${askState.facts.length ? `<ul class="ask-facts">${askState.facts.map(f => `<li><span>${esc(f.text)}</span><button class="btn" data-askfactdel="${f.id}" aria-label="احذف: ${esc(f.text)}">احذف</button></li>`).join("")}</ul>` : ""}
        <form id="askFactForm" class="ask-form"><label class="sr" for="askFact">تعليمة جديدة</label><input id="askFact" maxlength="200" placeholder="مثال: لا تقترح تفريغ ذاكرة الكرت"><button class="btn" type="submit">احفظ</button></form>`, { cls: "c12" });
    },
    after() {
      const f = $("#askForm"), i = $("#askInput"); if (!f) return;
      const log = $(".ask-log"); if (log) { log.scrollTop = askState.keep ?? log.scrollHeight; askState.keep = null; }   // آخر رد ظاهر، إلا بعد فعل على رسالة أقدم
      const ff = $("#askFactForm"), fi = $("#askFact");
      ff.onsubmit = async e => { e.preventDefault(); const text = fi.value.trim(); if (!text) return; try { askState.facts = (await post("/api/assistant-fact", { text })).facts; askHold(); } catch (x) { toast("تعذّر: " + x.message, true); } };
      f.onsubmit = e => { e.preventDefault(); askSend(i.value); };
      i.oninput = () => { askState.draft = i.value; };
      i.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askSend(i.value); } };
    },
  },

  space: {
    title: "المساحة", sub: "أين ذهبت المساحة وأكبر ما يشغل الأقراص", icon: "folder",
    async load() { return settle(api("/api/space")); },
    render([d]) {
      if (!d) return nodata("المساحة");
      const rec = Object.values(d.recoverableMB || {}).reduce((a, b) => a + (b || 0), 0);
      // بطاقة لكل قرص: الحر مع المقياس، المستخدم % بحالته (تحذير 85 وخطر 93 كمقياس «الأقراص»)؛ C يزيد تغيّر 24 ساعة وتقدير الامتلاء من سجل الحر، وغير C أكبر مجلد وعمر القياس
      const ageQ = ts => { const m = (Date.now() / 1000 - ts) / 60; return m < 90 ? Q(m, "د") : m < 2880 ? Q(m / 60, "س", 1) : Q(m / 1440, "يوم", 1); };
      const lvlTag = p => { const l = level(p, 85, 93); return l === "ok" ? "" : `<span class="tag ${l}">${l === "bad" ? "شبه ممتلئ" : "يقترب من الامتلاء"}</span>`; };
      const driveKpis = x => { const p = x.total ? x.used / x.total * 100 : 0; return kpi("حرّ", Q(x.free, "GB", 1), "", `من ${Q(x.total, "GB", 1)}`, meter(x.used, 85, 93, x.total)) + kpi("المستخدم", Q(p, "%", 1), "", lvlTag(p)); };
      const cD = (d.drives || []).find(x => x.letter === "C") || { used: 0, total: 0, free: d.free };
      const hs = d.hist || [], hl = hs.length ? hs[hs.length - 1] : null, hb = hl ? hs.find(x => x[0] >= hl[0] - 86400) : null;
      const dlt = hl && hb && hl[0] - hb[0] >= 6 * 3600 ? hl[1] - hb[1] : null, days = dlt !== null && dlt < -0.5 ? d.free / -dlt : null;
      const trend = kpi("التغير خلال 24 ساعة", dlt === null ? "—" : `<span class="tag ${dlt < -0.5 ? "warn" : "ok"}">${dlt < 0 ? "−" : "+"}${Q(Math.abs(dlt), "GB", 1)}</span>`, "", days !== null && days < 90 ? `يمتلئ بعد نحو ${Q(days, "يوم", 0)} بهذا المعدل` : "");
      let out = panel("القرص C", `<div class="kpis">${driveKpis(cD)}${trend}${kpi("قابل للتحرير بأمان", Q(rec, "MB"))}${kpi("آخر قياس", ageQ(d.ts))}${kpi("الوكيل", d.agent?.alive ? "يعمل" : "متوقف", "", "", "")}</div>${d.running ? '<span class="tag warn">تنظيف جارٍ</span>' : ""}`, { cls: "c12" });
      for (const x of (d.drives || []).filter(z => z.letter !== "C")) {
        const dp = d.dvol?.[x.letter], top = dp?.parts?.[0];
        out += panel(`القرص ${x.letter}${x.label ? " · " + x.label : ""}`, `<div class="kpis">${driveKpis(x)}${kpi("أكبر مجلد", top ? `<bdi dir="auto">${esc(top.label)}</bdi>` : "—", "", top ? Q(top.gb, "GB", 1) : "")}${kpi("عمر القياس", dp?.ts ? ageQ(dp.ts) : "—")}</div>`, { cls: "c12" });
      }
      out += panel("المجلدات المراقبة", `<table class="tbl"><thead><tr><th>المجلد</th><th class="n">الحجم</th><th class="n">التغير</th><th class="n">ملفات</th><th>نصيحة</th></tr></thead><tbody>${(d.items || []).map(i => `<tr><td>${esc(i.label)}</td><td class="n">${Q(i.gb, "GB", 2)}</td><td class="n">${i.delta ? `<span class="tag ${i.delta > 0 ? "warn" : "ok"}">${i.delta > 0 ? "+" : ""}${Q(i.delta, "", 2)}</span>` : "—"}</td><td class="n">${Q(i.files)}</td><td class="note">${esc(i.advice || "")}</td></tr>`).join("")}</tbody></table>`);
      out += panel("المساحة الحرة", `<div id="spChart" class="grow"></div>`, { cls: "c8" });
      out += panel("أكبر الهبوط", `<div class="list">${(d.drops || []).map(x => `<div class="li"><span class="t">${when(x.from)}</span><span class="r"><span class="tag bad">−${Q(x.gb, "GB", 1)}</span></span><span class="d">من ${Q(x.hi, "GB", 1)} إلى ${Q(x.lo, "GB", 1)}</span></div>`).join("") || '<div class="empty">لا هبوط ملحوظ</div>'}</div>`, { cls: "c4" });
      const vp = (parts, tot) => `${stack(parts.map(x => ({ label: x.label, v: x.gb })), PAL)}<div class="list">${parts.slice(0, 9).map((x, i) => `<div class="li"><span class="t"><i class="dot" style="background:${PAL[i % PAL.length]}"></i>${esc(x.label)}${x.partial ? ' <span class="tag">تقدير</span>' : ""}</span><span class="r">${Q(x.gb, "GB", 1)}</span><span class="d">${Q(x.gb / (tot || 1) * 100, "%")}</span></div>`).join("")}</div>`;
      out += panel("الأقراص", `<div class="list">${(d.drives || []).map(x => `<div class="li"><span class="t">${esc(x.letter)}: ${esc(x.label)}</span><span class="r">${Q(x.free, "GB", 1)} حرّ</span><span class="d">${Q(x.used, "GB", 1)} من ${Q(x.total, "GB", 1)}</span>${meter(x.used, 85, 93, x.total)}</div>`).join("")}</div>`, { cls: "c4" });
      out += panel("ما يشغله القرص C", d.volume ? vp([...d.volume.parts, ...(d.volume.other > 0 ? [{ label: "غير مصنّف (محميّ أو غير مقيس)", gb: d.volume.other }] : [])].sort((a, b) => b.gb - a.gb), d.volume.used) + (d.volume.other > 0 ? `<p class="note">«غير مصنّف» غالبًا ما لا يقرؤه الخادم بصلاحية عادية: مجلدات محميّة مثل WindowsApps داخل Program Files، و«System Volume Information» (نقاط الاستعادة)، و«Recovery»، وبيانات NTFS الوصفية.</p>` : "") : `<div class="empty">لا بيانات</div>`, { cls: "c4", meta: d.volume ? `${Q(d.volume.used, "GB", 1)} مستخدم` : "" });
      out += panel("القرص D", d.dvol?.D ? vp(d.dvol.D.parts, (d.drives || []).find(x => x.letter === "D")?.used) : `<div class="empty">لا بيانات</div>`, { cls: "c4" });
      return out;
    },
    after([d]) { if (!d?.hist?.length) return; const ix = compact(d.hist, 170), H = ix.map(i => d.hist[i]); chart($("#spChart"), { t: H.map(x => x[0]), series: [{ id: "s", name: "حرّ", color: "var(--accent)", v: H.map(x => x[1]), fmt: v => nf(v, 1) + " GB" }], min: Math.min(...H.map(x => x[1])) * .97, height: 220, yFmt: v => nf(v, 0) }); }
  },

async function procClose(t) {
  const pid = Number(t.dataset.procclose), name = t.dataset.procname || "", mb = Number(t.dataset.procmb) || 0;
  const size = mb >= 1024 ? nf(mb / 1024, 1) + " GB" : nf(mb) + " MB", shellish = /^(pwsh|powershell)[.]exe$/i.test(name);
  if (!(await confirmDlg(`إغلاق ${name} (PID ${pid})؟ يحرّر نحو ${size} من الالتزام، وقد يضيع عمل غير محفوظ فيه.${shellish ? " قد تكون هذه نافذة الويدجت أو غلاف التطبيق." : ""}`, "أغلق", true))) return;
  let r;
  try { r = await post("/api/proc-close", { pid, name, force: false }); } catch (e) { return toast("تعذّر: " + e.message, true); }
  if (!r.exited && r.windows > 0) {   // له نافذة ولم يستجب لطلب الإغلاق اللطيف (قد ينتظر حفظًا): الإنهاء القسري بتأكيد ثانٍ فقط
    if (!(await confirmDlg(`${name} لم يُغلق خلال 3 ثوانٍ؛ قد ينتظر حفظًا. إنهاؤه قسريًا الآن؟ يضيع ما لم يُحفظ.`, "أنهِ قسريًا", true))) { toast("طُلب الإغلاق؛ البرنامج ما زال يعمل"); return show(); }
    try { r = await post("/api/proc-close", { pid, name, force: true }); } catch (e) { return toast("تعذّر: " + e.message, true); }
  }
  toast(r.exited ? `أُغلق ${name} وحُرّر نحو ${size} من الالتزام` : `طُلب إغلاق ${name}؛ ما زال يعمل`, !r.exited);
  show();
}
const DWM_BIG_MB = 1024;   // لا يُعرض التأكيد الثاني إلا حين يحجز dwm ذاكرة تستحق وميض الشاشة
const gpuPurgeText = p => [p.freedMB != null ? `NVIDIA: حُرّر ${nf(p.freedMB)} MB` : "", p.sharedBeforeMB != null && p.sharedAfterMB != null ? `المشتركة: ${nf(p.sharedBeforeMB)} ← ${nf(p.sharedAfterMB)} MB` : "", p.text || ""].filter(Boolean).join(" · ") || "تم";
const mbUnit = mb => mb != null && mb >= 1024 ? [nf(mb / 1024, 1), "GB"] : [nf(mb), "MB"];
const gpuFreedKpis = p => {   // مؤشر المحرَّر: آخر تفريغ (NVIDIA + المشتركة) ونسبته مما كان محجوزًا قبله، ومجموع اليوم من سجل actions
  if (!p || (!p.ts && !p.todayCount)) return "";
  const nv = p.freedMB, sh = p.sharedFreedMB, last = nv == null && sh == null ? null : (nv || 0) + (sh || 0), base = (p.beforeMB || 0) + (p.sharedBeforeMB || 0);
  const [lv, lu] = mbUnit(last), [tv, tu] = mbUnit(p.todayFreedMB || 0);
  return `<div class="kpis two gpu-freed">${kpi("حُرّر في آخر تفريغ", lv, lu, p.ts ? `NVIDIA ${Q(nv, "MB")} · المشتركة ${Q(sh, "MB")}` : "", last != null && base ? meter(last / base * 100, 101, 101) : "")}${kpi("حُرّر اليوم", tv, tu, `مرّات التفريغ: ${Q(p.todayCount || 0)}`)}</div>`;
};
async function gpuPurge(dwm = false) {   // زر صفحة الرسوميات: POST يبدأ المرور في خيط، ثم نستطلع GET حتى ينتهي؛ dwm خطوة ثانية بتأكيد منفصل
  try { await post("/api/gpu-purge", { dwm }); } catch (e) { return toast("تعذّر: " + e.message, true); }
  toast(dwm ? "بدأت إعادة تشغيل مدير سطح المكتب؛ قد تومض الشاشة لحظة" : "بدأ تفريغ ذاكرة الكروت"); let p = null;
  for (let i = 0; i < (dwm ? 130 : 60); i++) { await new Promise(r => setTimeout(r, 700)); try { p = await api("/api/gpu-purge"); } catch { } if (p && !p.running) break; }
  if (!p || p.running) toast("ما زال التفريغ جاريًا؛ ستظهر النتيجة في صفحة الرسوميات", true);
  else if (p.err) toast("تعذّر: " + p.err, true);
  else toast(gpuPurgeText(p));
  show(true);
  if (!dwm && p && !p.running && p.dwmOn && p.dwmMB >= DWM_BIG_MB && await confirmDlg(`مدير سطح المكتب (dwm) يحجز ${nf(p.dwmMB / 1024, 1)} GB من ذاكرة الرسوميات المشتركة. إعادة تشغيله تحرّرها: تومض الشاشة لحظة ولا يُغلق أي برنامج. متابعة؟`, "أعد تشغيله", true)) gpuPurge(true);
}
// مؤشر «مباشر»: الوقت المرئي يتحدّث مع كل جولة لكنه خارج المنطقة الحية؛ قارئ الشاشة يسمع فقط الانتقال بين مباشر ومتعذّر (لا إعلان عند أول نجاح)
let liveErr = false;
function setLive(ok) { $("#live").classList.toggle("err", !ok); if (liveErr === !ok) return; liveErr = !ok; $("#liveState").textContent = ok ? "عاد التحديث المباشر" : "تعذّر التحديث"; }
const CACHE = {};                       // per page: last data + signature (stale-while-revalidate)
let seq = 0, inflight = false, curKey = "overview";
async function show(first = false) {
  if (!first && inflight) return;
  const main = $("#main"), pg = page, key = curKey;
  // a refresh must never disturb what the user is doing: skip while hovering or keyboard-reading a chart, typing, editing a form, or a dialog is open; focus on a button survives the redraw (refocus)
  if (!first && (main.querySelector(".chart:is(:hover,:focus-within)") || document.querySelector("dialog[open]") || main.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || dirtyForm(main))) return;
  const my = ++seq; inflight = true;
  try {
    const data = await pg.load();
    if (my !== seq || pg !== page) return;      // a newer request or another page took over
    if (data.every(x => x == null)) throw new Error("no data");
    const sig = JSON.stringify(data);
    CACHE[key] = { data, sig };
    setLive(true); $("#liveTxt").textContent = "مباشر · " + new Date().toLocaleTimeString("en-GB");
    if (!first && sig === lastSig) return;          // nothing changed: touch nothing
    lastSig = sig; last = data;
    const y = scrollY, fk = focusKey(main);
    paint(main, pg.render(data)); pg.after?.(data); refocus(main, fk);
    scrollTo(0, y);   // ومع show(true) بعد فعلٍ أيضًا؛ الانتقال بين الصفحات صفّر التمرير قبلها في route
  } catch (e) { if (my === seq && e.name !== "AbortError") { console.error("render/load failed:", e && e.stack || e); setLive(false); $("#liveTxt").textContent = "تعذّر التحديث"; if (first && !CACHE[key]) $("#main").innerHTML = `<div class="banner" role="alert">تعذّر الاتصال بالخادم. تأكد من تشغيل المرصد ثم أعد المحاولة.</div>`; } }
  finally { if (my === seq) inflight = false; }
}
// warm the heavy pages once the first one is on screen so opening them later is instant
async function prefetch() {
  for (const k of ["space", "spaceclean", "advice", "startup", "dbx", "health", "procs", "history"]) {
    if (CACHE[k]) continue;
    try { const data = await PAGES[k].load(); if (!data.every(x => x == null)) CACHE[k] = { data, sig: JSON.stringify(data) }; } catch { }
    await new Promise(r => setTimeout(r, 400));
  }
}
function schedule() { clearInterval(timer); const ms = +$("#every").value; if (ms) timer = setInterval(() => { if (!document.hidden) show(); }, ms); }
let trackedKey = "";
const AUTOMATED = navigator.webdriver === true || /Headless/i.test(navigator.userAgent);   // جولات Playwright ولقطات المتصفح بلا واجهة ليست فتحًا من المالك؛ كانت تلوّث العدّاد
function track(key) {
  if (AUTOMATED) return;   // عدّاد فتح الصفحات (البند 5): بلاغ واحد لكل انتقال إلى صفحة مختلفة؛ يُعدّ في الخادم لا في localStorage، والفشل صامت
  if (key === trackedKey) return; trackedKey = key;
  fetch("/api/page-open", { method: "POST", credentials: "same-origin", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page: key }) }).catch(() => { });
}
let routed = false;
function route() {
  const { key: k, qs } = parseHash(); const key = PAGES[k] ? k : "overview"; page = PAGES[key];
  $("#title").textContent = page.title; $("#subtitle").textContent = page.sub; document.title = "مرصد الجهاز";  /* الويدجت يطابق عنوان النافذة حرفيًا */
  buildNav(key); setNav(false); curKey = key; applyHash(qs); syncHash(); lastSig = ""; inflight = false; ++seq; track(key);
  const m = $("#main"), c = CACHE[key];
  if (c) { last = c.data; lastSig = c.sig; paint(m, page.render(c.data)); page.after?.(c.data); } else m.innerHTML = skeleton(6);
  scrollTo(0, 0); if (routed) m.focus({ preventScroll: true }); routed = true;   // بعد الانتقال يبدأ قارئ الشاشة ولوحة المفاتيح من المحتوى لا من أول الصفحة
  show(!c); schedule();
}
addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const r = e.target.closest("[data-range]"); if (r) { state.range = r.dataset.range; upd(); }
});
$("#refresh").onclick = () => show();
$("#every").onchange = schedule;
// الدرج على الشاشة الضيقة: الزر يعلن حالته (aria-expanded)، الفتح ينقل التركيز إلى أول رابط، وEsc يغلقه ويعيد التركيز إلى الزر؛ وهو مخفي عن Tab وهو مغلق (visibility في layout.css)
function setNav(open) { $("#nav").classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", String(open)); }
$("#menuBtn").onclick = () => { const open = !$("#nav").classList.contains("open"); setNav(open); if (open) $("#nav a")?.focus(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#nav").classList.contains("open")) { setNav(false); $("#menuBtn").focus(); } });
// هامش التمرير يتبع ارتفاع الشريط اللاصق الفعلي (يلتفّ في العروض الضيقة) حتى لا يغطي العنصر المركَّز عند Tab
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--bar-h", Math.ceil(e.borderBoxSize?.[0]?.blockSize ?? e.target.offsetHeight) + "px")).observe($(".bar"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) show(); });
const AP_KEY = "mw-v2-ap";
let APPEAR = null;
const darkMq = matchMedia("(prefers-color-scheme: dark)");
function applyAppearance(ap) {
  if (!ap || !ap.mode) return;
  APPEAR = { schemaVersion: 1, revision: ap.revision, mode: ap.mode, palette: ap.palette }; const root = document.documentElement;   // only the contract fields: the POST reply carries "ok", which the store rejects if echoed back
  root.dataset.theme = ap.mode === "auto" ? (darkMq.matches ? "dark" : "light") : ap.mode;
  root.dataset.palette = ap.palette || "teal";
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = getComputedStyle(root).getPropertyValue("--bg").trim() || tc.content;   // شريط المتصفح بلون الخلفية من tokens.css
  try { localStorage.setItem(AP_KEY, JSON.stringify({ mode: ap.mode, palette: ap.palette })); } catch (_) { }
}
try { applyAppearance(JSON.parse(localStorage.getItem(AP_KEY))); } catch (_) { }   // first paint only; the server value overrides it
async function loadAppearance() { try { const ap = await api("/api/appearance"); if (!APPEAR || ap.revision !== APPEAR.revision || ap.mode !== APPEAR.mode || ap.palette !== APPEAR.palette) { applyAppearance(ap); if (page && page === PAGES.appearance || page === PAGES.ctrl) show(true); } } catch { } }
darkMq.addEventListener("change", () => { if (APPEAR?.mode === "auto") applyAppearance(APPEAR); });
$("#theme").onclick = async () => {
  const cur = await api("/api/appearance").catch(() => APPEAR) || { mode: "auto", palette: "teal", revision: 0 }, next = { ...cur, mode: document.documentElement.dataset.theme === "dark" ? "light" : "dark" };
  applyAppearance(next);
  try { const r = await post("/api/appearance", next); applyAppearance(r); } catch (e) { toast("تعذّر حفظ المظهر: " + e.message, true); }
  show(true);
};
loadAppearance(); setInterval(loadAppearance, 20000);

/* ───────── desktop widget: show / hide from the header, opened once with the app ───────── */
let WG = null;
function paintWidget() { const b = $("#widgetBtn"); if (!b) return; b.setAttribute("aria-pressed", !!WG?.running); b.title = WG?.running ? "الويدجت ظاهر؛ اضغط لإخفائه" : "الويدجت مخفي؛ اضغط لإظهاره"; }   // زر تبديل: الاسم ثابت «الويدجت» والحالة في aria-pressed (ومظهر الزر المضغوط) لا في النص
async function syncWidget() { try { WG = await api("/api/widget"); paintWidget(); } catch { } }
$("#widgetBtn").onclick = async () => {
  const want = !WG?.running; $("#widgetBtn").disabled = true;
  try { WG = await post("/api/widget", { show: want }); toast(WG.running ? "ظهر الويدجت" : "أُخفي الويدجت"); } catch (e) { toast("تعذّر: " + e.message, true); }
  $("#widgetBtn").disabled = false; paintWidget();
};
(async () => {
  await syncWidget();
  try { if (!WG?.running && !sessionStorage.getItem("mw-v2-widget-auto")) { sessionStorage.setItem("mw-v2-widget-auto", "1"); WG = await post("/api/widget", { show: true }); paintWidget(); } } catch { }
  setInterval(syncWidget, 15000);
})();
setTimeout(prefetch, 2500);
route();
</script>
