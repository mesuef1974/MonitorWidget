<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>مرصد الجهاز</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
/* ───────── Design tokens ─────────
   Direction: "instrument cluster" — graphite surfaces, one phosphor accent, hairline panels,
   DIN-like numerals (Bahnschrift) against a calm Arabic UI face. Everything is a token. */
:root{
  --f-ui:"Segoe UI Variable Text","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --f-num:"Bahnschrift","Segoe UI Variable Display","Segoe UI",Tahoma,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-w:248px;
}
:root[data-theme="dark"]{
  --bg:#080b10;--bg-glow:rgba(62,230,176,.075);--panel:#0e131b;--panel2:#131a24;--raise:#18212d;
  --line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.13);
  --ink:#e9eef5;--ink2:#9ba8ba;--ink3:#69778c;
  --accent:#3ee6b0;--accent-ink:#03231a;--accent2:#7ca6ff;--violet:#b79cff;
  --ok:#3ee6b0;--warn:#ffb54a;--bad:#ff6b79;--ok-bg:rgba(62,230,176,.12);--warn-bg:rgba(255,181,74,.12);--bad-bg:rgba(255,107,121,.13);
  --grid:rgba(255,255,255,.055);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px -16px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f2efe8;--bg-glow:rgba(10,157,116,.09);--panel:#fffdf8;--panel2:#f8f5ee;--raise:#efeadf;
  --line:rgba(20,30,40,.09);--line2:rgba(20,30,40,.16);
  --ink:#121c29;--ink2:#455468;--ink3:#7a8797;
  --accent:#08a177;--accent-ink:#fff;--accent2:#2f62d6;--violet:#6f4fd0;
  --ok:#08a177;--warn:#c27a00;--bad:#d1334a;--ok-bg:rgba(8,161,119,.1);--warn-bg:rgba(194,122,0,.1);--bad-bg:rgba(209,51,74,.1);
  --grid:rgba(20,30,40,.08);--shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 26px -18px rgba(40,40,20,.35);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark light}
body{font:400 14px/1.55 var(--f-ui);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 85% -10%,var(--bg-glow),transparent 70%),
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 56px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/56px 100%;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:fixed;inset-block-start:8px;inset-inline-start:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;transform:translateY(-200%)}
.skip:focus{transform:none}
.q{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ───────── Shell ───────── */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;padding:var(--s5) var(--s4);border-inline-end:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,transparent),transparent);display:flex;flex-direction:column;gap:var(--s4);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s2) var(--s3)}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--accent2)));color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent)}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{color:var(--ink3);font-size:11.5px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink3);padding:var(--s2) var(--s3) var(--s1)}
.nav a{display:flex;align-items:center;gap:var(--s3);padding:7px var(--s3);border-radius:10px;color:var(--ink2);transition:background .18s var(--ease),color .18s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ok-bg);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nav a .ext{margin-inline-start:auto;opacity:.45;width:13px;height:13px}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s6);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.bar h1{font-size:22px;font-weight:650;letter-spacing:.1px}
.bar .sub{color:var(--ink3);font-size:12.5px}
.bar .grow{flex:1;min-width:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:5px 11px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.2s infinite}
.live.err i{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line2));background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
select.btn{appearance:none;padding-inline-end:12px}
.content{padding:var(--s5) var(--s6) 64px;width:100%;max-width:1760px;margin-inline:auto;display:grid;gap:var(--s4);grid-template-columns:repeat(12,minmax(0,1fr));align-content:start;align-items:start}
.menu-btn{display:none}

/* ───────── Panels ───────── */
.panel{grid-column:span 12;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s4) var(--s5) var(--s5);min-width:0;position:relative;display:flex;flex-direction:column;gap:var(--s3);animation:rise .5s var(--ease) both}
.panel::before{content:"";position:absolute;inset-inline-start:var(--s5);top:-1px;width:34px;height:2px;background:var(--accent);border-radius:2px;opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
@media(max-width:1280px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media(max-width:860px){.c3,.c4,.c5,.c6{grid-column:span 12}.app{grid-template-columns:1fr}.nav{position:fixed;inset-block:0;inset-inline-start:0;width:min(86vw,300px);z-index:50;transform:translateX(100%);transition:transform .25s var(--ease);background:var(--panel)}
  html[dir="rtl"] .nav{transform:translateX(100%)}.nav.open{transform:none!important}.menu-btn{display:inline-flex}.bar,.content{padding-inline:var(--s4)}}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.ph h2{font-size:12.5px;font-weight:650;letter-spacing:.06em;color:var(--ink2)}
.ph .meta{font-size:12px;color:var(--ink3)}
.chips{display:inline-flex;gap:4px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.chips button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.kpi{padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink3)}
.kpi .v{font-size:30px;line-height:1.05;font-weight:600;display:flex;align-items:baseline;gap:5px;direction:ltr;justify-content:flex-end}
.kpi .v small{font-size:13px;color:var(--ink3);font-family:var(--f-ui);font-weight:400}
.kpi .s{font-size:12px;color:var(--ink3)}
.meter{height:5px;border-radius:5px;background:var(--raise);overflow:hidden;margin-top:4px}
.meter>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s var(--ease)}
.meter.warn>i{background:var(--warn)}.meter.bad>i{background:var(--bad)}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--s3)}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s3) var(--s2)}
.gauge svg{width:100%;max-width:176px;height:auto;overflow:visible}
.gauge .gv{font:600 34px/1 var(--f-num);fill:var(--ink)}
.gauge .gu{font:500 12px var(--f-ui);fill:var(--ink3)}
.gauge .gl{font-size:13px;color:var(--ink2)}
.gauge .gs{font-size:11.5px;color:var(--ink3);margin-top:-2px}
.arc{transition:stroke-dashoffset .8s var(--ease),stroke .3s}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th.n{text-align:end}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:start;padding:6px var(--s2);border-bottom:1px solid var(--line2)}
.tbl td{padding:8px var(--s2);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{text-align:end;white-space:nowrap}
.tbl tr:hover td{background:color-mix(in srgb,var(--raise) 55%,transparent)}
.rowbar{display:flex;align-items:center;gap:var(--s2);min-width:110px}.rowbar .meter{flex:1;margin:0}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s3);padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{font-weight:550}.li .d{grid-column:1;color:var(--ink3);font-size:12.5px}.li .r{grid-row:1/3;grid-column:2;text-align:end}
.li .meter{grid-column:1/-1}
.empty{color:var(--ink3);text-align:center;padding:var(--s5) 0}
.note{font-size:12.5px;color:var(--ink3)}
/* charts */
.chart{position:relative;direction:ltr;padding-left:40px}
.plot{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .ln{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.chart .yl,.chart .xl{position:absolute;font:11px var(--f-num);color:var(--ink3);pointer-events:none}
.chart .yl{left:-40px;width:34px;text-align:right;transform:translateY(-50%)}
.chart .xl{bottom:-18px;transform:translateX(-50%)}
.chart .cur{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none;display:none}
.chart .tip{position:absolute;z-index:5;top:6px;min-width:128px;padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);font-size:12px;pointer-events:none;display:none;box-shadow:0 10px 28px -12px #000;direction:rtl}
.chart .tip b{display:block;font:600 11.5px var(--f-num);color:var(--ink3);margin-bottom:3px}
.chart .tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.chart .tip i{width:8px;height:8px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4);font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px}
/* skeleton + toast */
.sk{border-radius:8px;background:linear-gradient(90deg,var(--raise),var(--panel2),var(--raise));background-size:200% 100%;animation:sh 1.3s infinite linear;min-height:18px}
@keyframes sh{to{background-position:-200% 0}}
.banner{grid-column:1/-1;padding:var(--s3) var(--s4);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-bg);border-radius:var(--r-md);color:var(--bad);font-size:13px}
.hero{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap}
.hero .big{font:600 56px/1 var(--f-num)}
.hero h3{font-size:20px;font-weight:650}
.hero p{color:var(--ink2);max-width:60ch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}
.pill-row{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ───────── forms, switches, dialogs, toasts ───────── */
.switch{width:42px;height:24px;border-radius:999px;background:var(--raise);border:1px solid var(--line2);position:relative;flex:none;transition:background .2s var(--ease),border-color .2s}
.switch i{position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--ink2);transition:transform .2s var(--ease),background .2s}
.switch[aria-checked="true"]{background:var(--ok-bg);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.switch[aria-checked="true"] i{background:var(--accent);transform:translateX(-18px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.inp{resize:vertical;font-family:var(--f-mono);font-size:12.5px}
.fs{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4) var(--s4);margin:0 0 var(--s3);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3)}
.fs legend{padding:0 8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink3)}
.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}.toolbar .inp{flex:1;min-width:180px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s2)}
.acts{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.row-sw{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:6px 0}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:8px 0;border-bottom:1px solid var(--line)}
.field-row:last-of-type{border-bottom:0}
.stackbar{display:flex;height:12px;border-radius:8px;overflow:hidden;gap:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:8px}
.scroll{overflow:auto;max-width:100%}
.scrollbox{max-height:620px;overflow-y:auto;scrollbar-width:thin;padding-inline-end:6px}
.rowbtn{width:100%;text-align:start;border-radius:8px;padding-inline:8px}.rowbtn:hover{background:var(--raise)}.rowbtn[aria-pressed="true"]{background:var(--ok-bg);color:var(--accent)}
.cards{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:var(--s4)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s2);border-inline-start:4px solid var(--ink3);animation:rise .5s var(--ease) both}
.card h3{font-size:15px}.card p{color:var(--ink2);font-size:13.5px;flex:1}
.card.lvl-warn{border-inline-start-color:var(--warn)}.card.lvl-bad{border-inline-start-color:var(--bad)}.card.lvl-ok{border-inline-start-color:var(--ok)}
.swatches{display:flex;gap:var(--s3);flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg)}
.swatch i{width:18px;height:18px;border-radius:50%}.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ok-bg)}
.c12{grid-column:span 12}
td.acts{display:flex;gap:var(--s2);align-items:center;justify-content:flex-end;flex-wrap:wrap}
dialog.dlg{border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);color:var(--ink);padding:var(--s5);max-width:min(92vw,440px);box-shadow:0 30px 80px -20px #000}
dialog.dlg::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
dialog.dlg p{margin-bottom:var(--s4);line-height:1.7}.dlg-act{display:flex;gap:var(--s2);justify-content:flex-end}
#toasts{position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 14px 36px -14px #000;animation:rise .3s var(--ease)}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<div class="app">
  <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
  <div class="main">
    <header class="bar">
      <button class="btn menu-btn" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="grow"><h1 id="title">…</h1><div class="sub" id="subtitle"></div></div>
      <span class="live" id="live" role="status"><i></i><span id="liveTxt">جارٍ التحميل</span></span>
      <select class="btn" id="every" aria-label="معدل التحديث"><option value="5000">كل 5 ثوانٍ</option><option value="10000">كل 10 ثوانٍ</option><option value="30000">كل 30 ثانية</option><option value="0">يدوي</option></select>
      <button class="btn" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>تحديث</button>
      <button class="btn" id="theme" aria-label="تبديل السمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>
<script>
"use strict";
/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, d = 0) => (v == null || !isFinite(v)) ? "—" : Number(v).toLocaleString("en", { maximumFractionDigits: d, minimumFractionDigits: d });
const Q = (v, u = "", d = 0) => `<bdi dir="ltr" class="q">${nf(v, d)}${u ? " " + u : ""}</bdi>`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hhmm = t => new Date(t * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const level = (v, warn, bad) => v >= bad ? "bad" : v >= warn ? "warn" : "ok";
const gb = mb => mb >= 1024 ? nf(mb / 1024, 1) + " GB" : nf(mb, 0) + " MB";
const rate = bps => bps >= 1048576 ? nf(bps / 1048576, 1) + " MB/s" : bps >= 1024 ? nf(bps / 1024, 0) + " KB/s" : nf(bps, 0) + " B/s";

const svgi = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ""}</svg>`;

/* ───────── components ───────── */
function gauge({ value, label, unit = "%", sub = "", warn = 80, bad = 92, max = 100, decimals = 0 }) {
  const R = 62, C = 2 * Math.PI * R, sweep = 0.75, len = C * sweep;
  const pct = clamp((value ?? 0) / max, 0, 1), lv = value == null ? "ok" : level(value / max * 100, warn, bad);
  const col = `var(--${lv === "ok" ? "accent" : lv})`;
  let ticks = ""; for (let i = 0; i <= 20; i++) { const a = (135 + 270 * i / 20) * Math.PI / 180, big = i % 5 === 0, r1 = 74, r2 = big ? 80 : 77; ticks += `<line x1="${(90 + r1 * Math.cos(a)).toFixed(1)}" y1="${(90 + r1 * Math.sin(a)).toFixed(1)}" x2="${(90 + r2 * Math.cos(a)).toFixed(1)}" y2="${(90 + r2 * Math.sin(a)).toFixed(1)}" stroke="var(--ink3)" stroke-width="${big ? 1.6 : 1}" opacity="${big ? .7 : .4}"/>`; }
  return `<div class="gauge"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)} ${nf(value, decimals)}${esc(unit)}">
    ${ticks}
    <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--raise)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(135 90 90)"/>
    <circle class="arc" cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${(len * (1 - pct)).toFixed(1)}" transform="rotate(135 90 90)" style="filter:drop-shadow(0 0 7px color-mix(in srgb,${col} 55%,transparent))"/>
    <text class="gv" x="90" y="96" text-anchor="middle">${nf(value, decimals)}</text><text class="gu" x="90" y="118" text-anchor="middle">${esc(unit)}</text></svg>
    <div class="gl">${esc(label)}</div>${sub ? `<div class="gs">${sub}</div>` : ""}</div>`;
}
const meter = (v, warn = 80, bad = 92, max = 100) => `<div class="meter ${level(v / max * 100, warn, bad) === "ok" ? "" : level(v / max * 100, warn, bad)}"><i style="width:${clamp(v / max * 100, 0, 100)}%"></i></div>`;
const kpi = (l, v, u = "", s = "", m = "") => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v"><span class="num">${v}</span>${u ? `<small>${esc(u)}</small>` : ""}</div>${m}${s ? `<div class="s">${s}</div>` : ""}</div>`;
const panel = (title, body, { cls = "", meta = "", id = "" } = {}) => `<section class="panel ${cls}" ${id ? `id="${id}"` : ""}><div class="ph"><h2>${esc(title)}</h2><span class="meta">${meta}</span></div>${body}</section>`;
const skeleton = n => Array.from({ length: n }, (_, i) => `<section class="panel ${i % 3 === 0 ? "c8" : "c4"}"><div class="sk" style="height:14px;width:30%"></div><div class="sk" style="height:${120 + i % 3 * 40}px"></div></section>`).join("");

/* Line/area chart with a hover crosshair and tooltip. series: [{name,color,v:[],fmt,dashed}] */
function chart(el, { t, series, min = 0, max = null, height = 190, yFmt = v => nf(v, 0), fill = true }) {
  const W = 1000, H = height, pad = 6;
  const all = series.flatMap(s => s.v.filter(x => x != null));
  const hi = max ?? (all.length ? Math.max(...all) * 1.12 || 1 : 1), lo = min;
  const n = t.length, X = i => n < 2 ? 0 : i / (n - 1) * W, Y = v => H - pad - (clamp(v, lo, hi) - lo) / (hi - lo || 1) * (H - pad * 2);
  const paths = series.map(s => {
    let d = "", seg = false; s.v.forEach((v, i) => { if (v == null) { seg = false; return; } d += `${seg ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`; seg = true; });
    const area = fill && s.fill !== false ? `<path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#g-${s.id})" opacity=".9"/>` : "";
    return `<linearGradient id="g-${s.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".26"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>${area}<path class="ln" d="${d}" stroke="${s.color}" ${s.dashed ? 'stroke-dasharray="6 5"' : ""}/>`;
  }).join("");
  const ys = [0, .25, .5, .75, 1], xs = [0, .25, .5, .75, 1];
  el.innerHTML = `<div class="chart" style="height:${H}px;margin-block-end:22px"><div class="plot" style="height:${H}px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><g class="grid">${ys.map(f => `<line x1="0" x2="${W}" y1="${(H - pad - f * (H - pad * 2)).toFixed(1)}" y2="${(H - pad - f * (H - pad * 2)).toFixed(1)}"/>`).join("")}</g>${paths}</svg>
    ${ys.map(f => `<span class="yl" style="top:${((H - pad - f * (H - pad * 2)) / H * 100).toFixed(1)}%">${yFmt(lo + (hi - lo) * f)}</span>`).join("")}
    ${n > 1 ? xs.map(f => `<span class="xl" style="left:${f * 100}%">${hhmm(t[Math.round(f * (n - 1))])}</span>`).join("") : ""}
    <div class="cur"></div><div class="tip"></div></div></div>`;
  const box = $(".plot", el), cur = $(".cur", box), tip = $(".tip", box);
  box.addEventListener("pointermove", e => {
    const r = box.getBoundingClientRect(), f = clamp((e.clientX - r.left) / r.width, 0, 1), i = Math.round(f * (n - 1));
    cur.style.display = tip.style.display = "block"; cur.style.left = (i / (n - 1) * 100) + "%";
    tip.innerHTML = `<b>${hhmm(t[i])}</b>` + series.map(s => `<div><span><i style="background:${s.color}"></i> ${esc(s.name)}</span><span class="num">${s.v[i] == null ? "—" : (s.fmt || yFmt)(s.v[i])}</span></div>`).join("");
    const w = tip.offsetWidth; tip.style.left = clamp(f * r.width + 14, 0, r.width - w) + "px";
  });
  box.addEventListener("pointerleave", () => { cur.style.display = tip.style.display = "none"; });
}
const legend = items => `<div class="legend">${items.map(([c, l, d]) => `<span><i style="background:${c};${d ? "background:repeating-linear-gradient(90deg," + c + " 0 5px,transparent 5px 8px)" : ""}"></i>${esc(l)}</span>`).join("")}</div>`;
const compact = (arr, n = 140) => { if (arr.length <= n) return arr.map((_, i) => i); const step = arr.length / n; return Array.from({ length: n }, (_, i) => Math.floor(i * step)); };

/* ───────── data layer ───────── */
let ctl = null;
async function api(path) {
  const r = await fetch(path, { credentials: "same-origin", signal: ctl?.signal, headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
const settle = async (...ps) => (await Promise.allSettled(ps)).map(r => r.status === "fulfilled" ? r.value : null);

const toast = (msg, bad = false) => {
  let h = $("#toasts"); if (!h) { h = document.createElement("div"); h.id = "toasts"; h.setAttribute("role", "status"); document.body.append(h); }
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; h.append(t); setTimeout(() => t.remove(), 4200);
};
const confirmDlg = (text, okLabel = "تأكيد") => new Promise(res => {
  const d = document.createElement("dialog"); d.className = "dlg";
  d.innerHTML = `<form method="dialog"><p>${esc(text)}</p><div class="dlg-act"><button class="btn" value="no">إلغاء</button><button class="btn primary" value="yes" autofocus>${esc(okLabel)}</button></div></form>`;
  d.addEventListener("close", () => { res(d.returnValue === "yes"); d.remove(); }); document.body.append(d); d.showModal();
});
async function post(path, body) {
  const r = await fetch(path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

      if (!d) return `<div class="banner">تعذّر قراءة التنبيهات.</div>`;
      const F = [["mem", "الذاكرة", [["ramWarn", "تحذير الذاكرة %"], ["ramBad", "خطر الذاكرة %"], ["commitWarn", "تحذير الالتزام %"], ["commitBad", "خطر الالتزام %"]]], ["cpu", "المعالج", [["minCores", "حدّ التنبيه (نواة)"], ["windowMin", "النافذة (دقائق)"]]], ["disk", "القرص C", [["freeWarnGB", "تحذير: أقل من GB"], ["freeBadGB", "خطر: أقل من GB"]]], ["gpu", "كرت الشاشة", [["tempWarn", "تحذير الحرارة °"], ["tempBad", "خطر الحرارة °"]]]];
      return `<form id="alForm" class="panel" style="grid-column:span 7"><div class="ph"><h2>الحدود</h2></div>${F.map(([sec, t, fs]) => `<fieldset class="fs"><legend>${t}</legend>${fs.map(([k, l]) => `<label class="fld"><span>${l}</span><input class="inp" type="number" dir="ltr" name="${sec}.${k}" value="${d.cfg[sec][k]}" step="any" min="${d.limits[sec][k][0]}" max="${d.limits[sec][k][1]}"></label>`).join("")}</fieldset>`).join("")}<fieldset class="fs"><legend>برامج لا ينبّه المعالج عنها</legend><textarea class="inp" name="cpu.ignore" rows="3" dir="ltr" placeholder="backup.exe">${esc((d.cfg.cpu.ignore || []).join("\n"))}</textarea></fieldset><div class="acts"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" id="alReset">القيم الافتراضية</button></div></form>`
        + panel("سجل التنبيهات", `<div class="list scrollbox">${d.log.map(x => `<div class="li"><span class="t"><span class="tag ${sev(x.sev)}">${esc(x.source)}</span> ${esc(x.title)}</span><span class="r note">${when(x.ts)}</span><span class="d">${esc(x.detail || "")}</span></div>`).join("") || '<div class="empty">لا تنبيهات</div>'}</div>`, { cls: "c5" });
    },
    after([d]) {
      const f = $("#alForm"); if (!f) return;
      f.onsubmit = async e => { e.preventDefault(); const o = { cpu: {}, mem: {}, disk: {}, gpu: {} }; f.querySelectorAll("input[type=number]").forEach(i => { const [s, k] = i.name.split("."); o[s][k] = Number(i.value); }); o.cpu.ignore = f.querySelector("textarea").value.split(/\r?\n/).map(x => x.trim()).filter(Boolean); await act(() => post("/api/alerts", o), "حُفظت حدود التنبيه"); };
      $("#alReset").onclick = () => { for (const [sec, vals] of Object.entries(d.defaults)) for (const [k, v] of Object.entries(vals)) { const i = f.querySelector(`[name="${sec}.${k}"]`); if (i && k !== "ignore") i.value = v; } };
    }
  },

  ctrl: {
    title: "الإعدادات والتحكم", sub: "المهام الخلفية وتنظيف الذاكرة والمظهر", icon: "sliders",
    async load() { return settle(api("/api/jobs"), api("/api/maintenance"), api("/api/appearance")); },
    render([j, m, ap]) {
      let out = panel("المظهر", `<div class="field-row"><span>الوضع</span><div class="chips" role="group">${[["auto", "تلقائي"], ["light", "فاتح"], ["dark", "داكن"]].map(([k, l]) => `<button data-mode="${k}" aria-pressed="${ap?.mode === k}">${l}</button>`).join("")}</div></div><div class="field-row"><span>لون الهوية</span><div class="chips" role="group">${[["teal", "أخضر بحري"], ["blue", "أزرق"], ["violet", "بنفسجي"], ["graphite", "رمادي"]].map(([k, l]) => `<button data-palette="${k}" aria-pressed="${ap?.palette === k}">${l}</button>`).join("")}</div></div><p class="note">يُحفظ اختيار الواجهة الحالية والويدجت معًا. هذه الواجهة الجديدة لها سمتها الخاصة (زر القمر).</p>`, { cls: "c6" });
      out += panel("الذاكرة", `<p>تقليص مجموعات عمل العمليات مؤقتًا دون إنهاء أي عملية.</p><div class="acts"><button class="btn primary" data-trim="light">تنظيف الذاكرة الآن</button><button class="btn" data-trim="deep">تنظيف عميق</button></div>`, { cls: "c6" });
      out += panel("وضع الصيانة المؤقت", m ? `<div class="row-sw"><span>${m.on ? "مفعّل" : "غير مفعّل"} — يوقف ${(m.rules || []).map(esc).join("، ")} أثناء عمل Claude Code</span>${sw(!!m.on, 'data-maint="1"')}</div>` : '<div class="empty">غير متاح</div>', { cls: "c12" });
      out += panel("المهام الخلفية", j ? `<table class="tbl"><thead><tr><th>المهمة</th><th class="n">كل</th><th>آخر تشغيل</th><th>الحالة</th><th class="n">التالي</th><th></th></tr></thead><tbody>${j.jobs.map(x => `<tr><td><b>${esc(x.name)}</b></td><td class="n">${dur(x.interval_s)}</td><td class="note">${when(x.last_end)} · ${Q(x.last_ms / 1000, "ث", 1)}</td><td><span class="tag ${x.last_status === "ok" ? "ok" : "bad"}">${esc(x.last_status || "—")}</span> <span class="note">${Q(x.runs)} تشغيل · ${Q(x.fails)} فشل</span></td><td class="n note">${when(x.next_run)}</td><td><button class="btn" data-job="${esc(x.name)}">تشغيل</button></td></tr>`).join("")}</tbody></table>` : '<div class="empty">غير متاح</div>');
      return out;
    }
  },

  dbx: {
    title: "قاعدة البيانات", sub: "مخطط القاعدة وصفوف الجداول للقراءة فقط", icon: "db",
    async load() {
      const db = await api("/api/db").catch(() => null); if (db && !ui.dbTable) ui.dbTable = db.tables[0]?.name || "";
      const rows = db && ui.dbTable ? await api(`/api/db/rows?table=${encodeURIComponent(ui.dbTable)}&limit=15&offset=${ui.dbOff}`).catch(() => null) : null;
      return [db, rows];
    },
    render([db, rows]) {
      if (!db) return `<div class="banner">تعذّر قراءة القاعدة.</div>`;
      let out = panel("الملف", `<div class="kpis">${kpi("الحجم", Q(db.bytes / 1048576, "MB", 1))}${kpi("سجل WAL", Q(db.walBytes / 1048576, "MB", 1))}${kpi("الجداول", Q(db.tables.length))}${kpi("الإصدار", Q(db.schema))}</div>`);
      out += panel("الجداول", `<div class="list scrollbox">${db.tables.map(t => `<button class="li rowbtn" data-tbl="${esc(t.name)}" aria-pressed="${ui.dbTable === t.name}"><span class="t">${esc(t.name)}</span><span class="r">${Q(t.rows)}</span></button>`).join("")}</div>`, { cls: "c4" });
      const cols = rows?.columns || rows?.cols || (rows?.rows?.[0] ? Object.keys(rows.rows[0]) : []);
      out += panel(ui.dbTable || "—", rows ? `<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c => `<th>${esc(c.name || c)}</th>`).join("")}</tr></thead><tbody>${(rows.rows || []).map(r => `<tr>${(Array.isArray(r) ? r : cols.map(c => r[c.name || c])).map(v => `<td class="note" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${pager("db", rows.total || 0, 15, ui.dbOff)}` : '<div class="empty">اختر جدولًا</div>', { cls: "c8", meta: `${Q(rows?.total)} صفًا` });
      return out;
    }
  },

  appearance: {
    title: "المظهر الموحد", sub: "الوضع ولون الهوية للتطبيق والويدجت", icon: "palette",
    async load() { return settle(api("/api/appearance")); },
    render([ap]) {
      const sw2 = { teal: "#3ee6b0", blue: "#7ca6ff", violet: "#b79cff", graphite: "#9aa7b8" };
      return panel("الوضع", `<div class="chips" role="group">${[["auto", "تلقائي"], ["light", "فاتح"], ["dark", "داكن"]].map(([k, l]) => `<button data-mode="${k}" aria-pressed="${ap?.mode === k}">${l}</button>`).join("")}</div>`, { cls: "c6" })
        + panel("لون الهوية", `<div class="swatches">${[["teal", "أخضر بحري"], ["blue", "أزرق"], ["violet", "بنفسجي"], ["graphite", "رمادي"]].map(([k, l]) => `<button class="swatch" data-palette="${k}" aria-pressed="${ap?.palette === k}"><i style="background:${sw2[k]}"></i>${l}</button>`).join("")}</div>`, { cls: "c6" })
        + panel("للمعلومات", `<p class="note">المراجعة ${Q(ap?.revision)} · يُطبَّق الاختيار على الواجهة الحالية والويدجت. الواجهة الجديدة لها سمتها (زر القمر في الأعلى) وتتبع نظام التشغيل افتراضيًا.</p>`);
    }
  }
});

/* delegated actions for the pages above */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.pg) { const id = t.dataset.pg, off = +t.dataset.off; if (id === "ev") ui.evOff = off; else if (id === "run") ui.runOff = off; else ui.dbOff = off; show(); }
  else if (t.dataset.tbl) { ui.dbTable = t.dataset.tbl; ui.dbOff = 0; show(); }
  else if (t.dataset.reaper) { act(() => post("/api/reaper", { key: "killBareClaudeShells", value: t.getAttribute("aria-checked") !== "true" }), "حُدّث إعداد الكانس"); }
  else if (t.dataset.plan) { if (await confirmDlg(`تفعيل خطة الطاقة «${t.dataset.pname}»؟ تُطبَّق فورًا على الجهاز.`)) act(() => post("/api/power-plan", { guid: t.dataset.plan }), "فُعّلت الخطة"); }
  else if (t.dataset.st) { const on = t.getAttribute("aria-checked") !== "true"; if (await confirmDlg(on ? "تفعيل هذا العنصر عند بدء التشغيل؟" : "تعطيل هذا العنصر عند بدء التشغيل؟")) act(() => post("/api/startup", { id: t.dataset.st, enabled: on }), "تم — يسري عند الدخول التالي"); }
  else if (t.dataset.task) { const run = t.dataset.task === "run", on = t.getAttribute("aria-checked") === "true"; const ok = await confirmDlg(run ? `تشغيل المهمة «${t.dataset.n}» الآن؟` : on ? "إيقاف جدولة هذه المهمة؟" : "تفعيل جدولة هذه المهمة؟"); if (ok) act(() => post("/api/task", { op: run ? "run" : on ? "disable" : "enable", path: t.dataset.p, name: t.dataset.n }), run ? "بدأ التشغيل" : "تم"); }
  else if (t.dataset.rule) { const on = t.getAttribute("aria-checked") === "true"; if (await confirmDlg(on ? "تعطيل هذه القاعدة؟" : "تفعيل هذه القاعدة؟")) act(() => post("/api/rule", { id: t.dataset.rule, enabled: !on }), "حُدّثت السياسة"); }
  else if (t.dataset.adv) { const a = JSON.parse(t.dataset.adv); if (!["/api/trim-memory", "/api/trim-auto", "/api/maintenance"].includes(a.api)) return toast("إجراء غير مسموح", true); if (a.confirm && !(await confirmDlg(a.confirm))) return; act(() => post(a.api, a.body), "بدأ التنفيذ"); }
  else if (t.dataset.mode || t.dataset.palette) { const cur = await api("/api/appearance").catch(() => null); if (!cur) return; const next = { ...cur, ...(t.dataset.mode ? { mode: t.dataset.mode } : { palette: t.dataset.palette }) }; act(() => post("/api/appearance", next), "حُفظ المظهر"); }
  else if (t.dataset.trim) { if (await confirmDlg(t.dataset.trim === "deep" ? "تنظيف عميق للذاكرة؟ قد يبطّئ التطبيقات لحظات." : "تنظيف الذاكرة الآن؟")) act(() => post("/api/trim-memory", { mode: t.dataset.trim }), "بدأ التنظيف"); }
  else if (t.dataset.maint) { const on = t.getAttribute("aria-checked") === "true"; act(() => post("/api/maintenance", { on: !on }), "حُدّث وضع الصيانة"); }
  else if (t.dataset.job) { if (await confirmDlg(`تشغيل المهمة «${t.dataset.job}» الآن؟`)) act(() => post("/api/jobs/run", { name: t.dataset.job }), "بدأ التشغيل"); }
});

const NAV = [
  ["نظرة", [["overview", "نظرة عامة"], ["health", "صحة الجهاز"], ["advice", "التوصيات"], ["alerts", "التنبيهات"]]],
  ["الأداء", [["cpu", "المعالج"], ["mem", "الذاكرة"], ["gpu", "الرسوميات"], ["procs", "العمليات"], ["wsl", "WSL وDocker"], ["power", "الطاقة والحرارة"], ["io", "حركة القرص"]]],
  ["الصيانة", [["space", "المساحة"], ["startup", "بدء التشغيل"], ["tasks", "الجدولة"], ["rules", "قواعد التنظيف"]]],
  ["السجل والإعدادات", [["history", "السجل"], ["dbx", "القاعدة"], ["ctrl", "التحكم"], ["appearance", "المظهر الموحد"]]]
];
const LEGACY = [];

/* ───────── shell + router ───────── */
function buildNav(cur) {
  $("#nav").innerHTML = `<div class="brand"><div class="brand-mark">${svgi("cpu").replace("<svg", '<svg width="22" height="22"')}</div><div><b>مرصد الجهاز</b><small>الواجهة الجديدة</small></div></div>`
    + NAV.map(([g, items]) => `<div class="nav-group"><div class="nav-label">${g}</div>${items.map(([k, l]) => `<a href="#/${k}" ${k === cur ? 'aria-current="page"' : ""}>${svgi(PAGES[k].icon)}<span>${l}</span></a>`).join("")}</div>`).join("")
    + (LEGACY.length ? `<div class="nav-group"><div class="nav-label">صفحات أخرى</div>${LEGACY.map(([k, l]) => `<a href="/#${k}"><span>${l}</span>${svgi("ext", "ext")}</a>`).join("")}</div>` : "")
    + `<div class="nav-foot"><small class="note">القراءة محليّة من 127.0.0.1 — لا اتصال خارجي.</small></div>`;
}
let timer = 0, page = null, last = null, busy = false;
async function show(first = false) {
  if (busy) return; busy = true; ctl?.abort(); ctl = new AbortController();
  const live = $("#live");
  try {
    const data = await page.load();
    if (data.every(x => x == null)) throw new Error("no data");
    last = data; const main = $("#main"); main.innerHTML = page.render(data); page.after?.(data);
    live.classList.remove("err"); $("#liveTxt").textContent = "مباشر · " + new Date().toLocaleTimeString("en-GB");
  } catch (e) { if (e.name !== "AbortError") { console.error("render/load failed:", e && e.stack || e); live.classList.add("err"); $("#liveTxt").textContent = "تعذّر التحديث"; if (first) $("#main").innerHTML = `<div class="banner">تعذّر الاتصال بالخادم. تأكد من تشغيل المرصد ثم أعد المحاولة.</div>`; } }
  finally { busy = false; }
}
function schedule() { clearInterval(timer); const ms = +$("#every").value; if (ms) timer = setInterval(() => { if (!document.hidden) show(); }, ms); }
function route() {
  const k = (location.hash.replace(/^#\/?/, "") || "overview").split("?")[0]; const key = PAGES[k] ? k : "overview"; page = PAGES[key];
  $("#title").textContent = page.title; $("#subtitle").textContent = page.sub; document.title = page.title + " — مرصد الجهاز";
  buildNav(key); $("#nav").classList.remove("open"); $("#main").innerHTML = skeleton(6); show(true); schedule(); scrollTo(0, 0);
}
addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const r = e.target.closest("[data-range]"); if (r) { state.range = r.dataset.range; show(); }
});
$("#refresh").onclick = () => show();
$("#every").onchange = schedule;
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
document.addEventListener("visibilitychange", () => { if (!document.hidden) show(); });
const THEME_KEY = "mw-v2-theme";
const applyTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch (_) {} };
try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light"; } catch (_) {}
$("#theme").onclick = () => { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); show(); };
route();
</script>
